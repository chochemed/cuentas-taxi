        <option value="siempre" ${!g.desde?'selected':''}>Lo he tenido siempre</option>
        <option value="hoy" ${g.desde?'selected':''}>Empieza a contar desde una fecha</option>
      </select>
      <div id="gfBloqueDesde" style="display:${g.desde?'block':'none'}">
        <label>Fecha de inicio</label>
        <input id="gfFechaInicio" class="input" type="date" value="${g.desde||localDate()}" max="${localDate()}">
      </div>
      <label>Duración</label>
      <select id="gfDuracion" class="input" onchange="gfDuracionChange()">
        <option value="siempre" ${!g.meses?'selected':''}>Para siempre</option>
        <option value="meses" ${g.meses?'selected':''}>Durante un número de meses</option>
      </select>
      <div id="gfBloqueMeses" style="display:${g.meses?'block':'none'}">
        <label>¿Cuántos meses va a durar?</label>
        <input id="gfMeses" class="input" type="number" inputmode="numeric" min="1" value="${g.meses||''}">
      </div>
      <button class="btn primary" onclick="guardarEdicionGastoFijo(${g.id})">GUARDAR CAMBIOS</button>
      <button class="btn small" onclick="state.screen='perfil';render()">CANCELAR</button>
    </div>`;

    document.getElementById('gfBloqueDesde').style.display = (sel.value==='hoy'?'block':'none');
  };
}

function guardarEdicionGastoFijo(id){
  const g = (db.perfil && db.perfil.gastosFijos) ? db.perfil.gastosFijos.find(x=>x.id===id) : null;
  if(!g) return alert('Gasto no encontrado');
  const motivo = document.getElementById('gfMotivo').value.trim();
  const cantidad = parseMoney(document.getElementById('gfCantidad').value);
  const frecuencia = document.getElementById('gfFrecuencia').value;
  const desdeSel = document.getElementById('gfDesde').value;
  const fechaInicio = document.getElementById('gfFechaInicio').value;
  const duracion = document.getElementById('gfDuracion').value;
  if(!motivo) return alert('Escribe un motivo');
  if(!(cantidad > 0)) return alert('Cantidad inválida');
  let meses = null;
  if(duracion === 'meses'){
    meses = Math.floor(Number(document.getElementById('gfMeses').value));
    if(!Number.isFinite(meses) || meses < 1) return alert('Introduce un número de meses válido');
  }
  g.motivo = motivo;
  g.cantidad = cantidad;
  g.frecuencia = frecuencia;
  g.desde = (desdeSel === 'hoy') ? (fechaInicio || localDate()) : null;
  g.meses = meses;
  save();
  alert('Gasto fijo actualizado');
  state.screen = 'perfil';
  render();
}


/* ===== EDITAR KM DE UN DÍA ===== */
function editarKmDia(dayId){
  const d = db.days.find(x=>x.id===dayId);
  if(!d) return alert('Día no encontrado');
  document.getElementById('screen').innerHTML = `
    <div class="card">
      <h2>✏️ EDITAR KM DEL DÍA</h2>
      <p class="muted">${esc(d.date)} · ${d.closed?'Cerrado':'Abierto'}</p>
      <label>Km iniciales</label>
      <input id="ekIni" class="input" type="number" inputmode="numeric" step="1" value="${d.startKm||0}">
      ${d.closed ? '<label>Km finales</label><input id="ekFin" class="input" type="number" inputmode="numeric" step="1" value="'+(d.endKm||0)+'">' : '<p class="muted" style="font-size:12px">Los km finales se ponen al cerrar el día.</p>'}
      <button class="btn primary" onclick="guardarKmDia(${d.id})">GUARDAR CAMBIOS</button>
      <button class="btn small" onclick="state.screen=${d.closed?"'dayDetail'":"'menu'"};state.day=${d.id};render()">CANCELAR</button>
    </div>`;
}

function guardarKmDia(dayId){
  const d = db.days.find(x=>x.id===dayId);
  if(!d) return alert('Día no encontrado');
  const ini = Math.floor(Number(document.getElementById('ekIni').value));
  if(!Number.isFinite(ini) || ini < 0) return alert('Km iniciales inválidos');
  let fin = null;
  if(d.closed){
    fin = Math.floor(Number(document.getElementById('ekFin').value));
    if(!Number.isFinite(fin) || fin < 0) return alert('Km finales inválidos');
    if(fin < ini) return alert('Los km finales no pueden ser menores que los iniciales');
  }
  d.startKm = ini;
  if(d.closed) d.endKm = fin;
  regenReport(dayId);
  save();
  recalcularConsumosRepostajes();
  alert('Km actualizados');
  if(d.closed){ state.screen='dayDetail'; state.day=d.id; }
  else { state.screen='menu'; state.day=d.id; }
  render();
}

/* ===== Quitar el título «CUENTAS TAXI» de los informes ya guardados ===== */
(function(){
  try{
    const re=/<h1[^>]*>\s*(?:🚕\s*)?CUENTAS TAXI\s*<\/h1>/g;
    let cambio=false;
    Object.keys(db).forEach(k=>{
      if(Array.isArray(db[k])) db[k].forEach(it=>{
        if(it&&typeof it.html==='string'){ const n=it.html.replace(re,''); if(n!==it.html){ it.html=n; cambio=true; } }

})();

function manBorrarGasto(i){
  if(!state.manual||!state.manual.gastos) return;
  state.manual.gastos.splice(i,1);
  render();
}
function manGuardarDia(){
  const m=state.manual;
  if(!m||!m.fecha) return alert('Error: falta la fecha.');
  if((db.days||[]).find(d=>d.date===m.fecha)) return alert('Ya existe un día con la fecha '+m.fecha+'.');
  const baseTime=new Date(m.fecha+'T12:00:00').toISOString();
  let seq=Date.now();
  const nid=()=>++seq;
  const cobros=[];
  if(m.modo==='cobro'){
    (m.cobros||[]).forEach(c=>{
      cobros.push({id:nid(),time:baseTime,amount:parseMoney(c.amount),method:c.method,terminal:c.terminal||null,amex:c.amex==null?null:c.amex,note:c.note||'',esEmisora:!!c.esEmisora});
    });
  }else if(m.modo==='total'){
    Object.entries(state.manualTotales||{}).forEach(([k,v])=>{
      const n=parseMoney(v);
      if(n>0) cobros.push({id:nid(),time:baseTime,amount:n,method:k,terminal:null,amex:null,note:'Introducido manualmente',esEmisora:false});
    });
  }

/* ===== GASTOS FIJOS: respetan «desde» y «duración», y se calculan por mes ===== */
function gastosFijosMes(ym){
  const p=db.perfil||{};
  const fijos=p.gastosFijos||[];
  ym=ym||monthKey(new Date());
  let total=0;
  const desglose=[];
  fijos.forEach(g=>{
    const cantidad=Number(g.cantidad)||0;
    let ini=g.desde?String(g.desde).slice(0,7):null;
    if(!ini&&g.meses&&g.id) ini=monthKey(new Date(g.id));
    if(ini&&ym<ini) return;
    if(g.meses&&ini){
      const a=ini.split('-').map(Number);
      const fin=new Date(a[0],a[1]-1+Number(g.meses),1);
      if(ym>=fin.getFullYear()+'-'+String(fin.getMonth()+1).padStart(2,'0')) return;
    }
    if(g.frecuencia==='mensual'){ total+=cantidad; desglose.push({motivo:g.motivo,importe:cantidad,tipo:'mensual'}); }
    else if(g.frecuencia==='anual'){ total+=cantidad/12; desglose.push({motivo:g.motivo,importe:cantidad/12,tipo:'anual/12'}); }
    else if(g.frecuencia==='trimestral'){ total+=cantidad/3; desglose.push({motivo:g.motivo,importe:cantidad/3,tipo:'trimestral/3'}); }
  });
  return {total,desglose};
}
function resumenAnual(anio){
  const desde=new Date(anio,0,1).getTime();
  const hasta=new Date(anio,11,31,23,59,59).getTime();
  const ds=db.days.filter(d=>{ const t=new Date(d.date+'T12:00:00').getTime(); return t>=desde&&t<=hasta; });
  const gsSueltos=(db.gastosSueltos||[]).filter(g=>{ if(!g.fecha) return false; const t=new Date(g.fecha+'T12:00:00').getTime(); return t>=desde&&t<=hasta; });
  const t={Efectivo:0,Tarjeta:0,Amex:0,Abonado:0,'Pago app':0,Bizum:0};
  let inc=0,exp=0,services=0,km=0,minutes=0;
  ds.forEach(d=>{
    inc+=sumCharges(d); exp+=sumExpenses(d);
    services+=(d.charges||[]).length;
    Object.entries(totals(d)).forEach(([k,v])=>t[k]=(t[k]||0)+v);
    if(d.endKm!=null) km+=Number(d.endKm)-Number(d.startKm);
    if(d.close) minutes+=minutesBetween(d.start,d.close);
  });
  gsSueltos.forEach(g=>{ exp+=Number(g.amount||0); });
  /* Gastos fijos: solo los meses ya transcurridos del año */
  const hoy=new Date();
  const ultimo=anio<hoy.getFullYear()?12:(anio===hoy.getFullYear()?hoy.getMonth()+1:0);
  let fijos=0;
  for(let mm=1;mm<=ultimo;mm++) fijos+=gastosFijosMes(anio+'-'+String(mm).padStart(2,'0')).total;
  const consumo=consumoDelPeriodo(desde,hasta);
  const elecAnio=electricidadRango(anio+'-01-01',anio+'-12-31').total;
  const expTotal=exp+fijos+elecAnio;
  return {anio,days:ds.length,inc,exp:expTotal,net:inc-expTotal,services,km,minutes,t,consumo,gastosFijosAnual:fijos};
}

/* Anchos de Helvetica (por cada 1000 unidades) para los caracteres 32..126 */
const PDF_ANCHO_REG=[278,278,355,556,556,889,667,191,333,333,389,584,278,333,278,278,556,556,556,556,556,556,556,556,556,556,278,278,584,584,584,556,1015,667,667,722,722,667,611,778,722,278,500,667,556,833,722,778,667,778,722,667,611,722,667,944,667,667,611,278,278,278,469,556,333,556,556,500,556,556,278,556,556,222,222,500,222,833,556,556,556,556,333,500,278,556,500,722,500,500,500,334,260,334,584];
const PDF_ANCHO_NEG=[278,333,474,556,556,889,722,238,333,333,389,584,278,333,278,278,556,556,556,556,556,556,556,556,556,556,333,333,584,584,584,611,975,722,722,722,722,667,611,778,722,278,556,722,611,833,722,778,667,778,722,667,611,722,667,944,667,667,611,333,278,333,584,556,333,556,611,556,611,556,333,611,611,278,278,556,278,889,611,611,611,611,389,556,333,611,556,778,556,556,500,389,280,389,584];
const PDF_EXTRA={0x20AC:0x80,0x2013:0x96,0x2014:0x97,0x2018:0x91,0x2019:0x92,0x201C:0x93,0x201D:0x94,0x2022:0x95,0x2026:0x85};

/* Deja solo caracteres que el PDF (WinAnsi) sabe dibujar; quita emojis y símbolos raros */
function pdfLimpiar(s){
  s=String(s==null?'':s).replace(/→/g,'->').replace(/←/g,'<-').replace(/≥/g,'>=').replace(/≤/g,'<=').replace(/Δ/g,'Dif.').replace(/[\u200B-\u200D\uFE0E\uFE0F]/g,'');
  let r='';
  for(const ch of s){
    const c=ch.codePointAt(0);
    if(c===160||c===9||c===10||c===13) r+=' ';
    else if(c>=32&&c<=126) r+=ch;
    else if(c>=161&&c<=255) r+=ch;
    else if(PDF_EXTRA[c]) r+=String.fromCharCode(PDF_EXTRA[c]);
  }
  return r;
}
/* Vuelve a caracteres normales (para el texto del mensaje de WhatsApp / correo) */
function pdfAUnicode(s){
  return String(s).replace(/[\x80\x85\x91-\x97]/g,c=>({'\x80':'€','\x85':'…','\x91':"'",'\x92':"'",'\x93':'"','\x94':'"','\x95':'•','\x96':'–','\x97':'—'}[c]));
}
function pdfAncho(s,neg,size){
  const T=neg?PDF_ANCHO_NEG:PDF_ANCHO_REG;
  let w=0;
  for(let i=0;i<s.length;i++){
    const c=s.charCodeAt(i);
    if(c>=32&&c<=126) w+=T[c-32];
    else if(c===0x97||c===0x85) w+=1000;
    else if(c===0x95) w+=350;
    else if(c>=0x91&&c<=0x94) w+=300;
    else if(c===0xB7) w+=278;
    else if(c===0xBF) w+=611;
    else if(c===0xA1) w+=333;
    else if(c>=192&&c<=255){ const b=String.fromCharCode(c).normalize('NFD').charCodeAt(0); w+=(b>=32&&b<=126)?T[b-32]:611; }
    else w+=556;
  }
  return w*size/1000;
}

/* ---------- HTML -> modelo de bloques (párrafos y tablas) ---------- */
const PDF_SALTAR=['SCRIPT','STYLE','BUTTON','SELECT','INPUT','TEXTAREA','NOSCRIPT'];
function pdfOculto(el){
  if(!el||el.nodeType!==1) return false;
  if(PDF_SALTAR.indexOf(el.tagName)>-1) return true;
  const cl=el.classList;
  if(cl&&(cl.contains('noPrint')||cl.contains('pdfHeader'))) return true;
  return (el.getAttribute('style')||'').replace(/\s/g,'').toLowerCase().indexOf('display:none')>-1;
}
function pdfTokens(nodo,neg,out){
  out=out||[];
  Array.prototype.forEach.call(nodo.childNodes,n=>{
    if(n.nodeType===3){ const t=pdfLimpiar(n.nodeValue); if(t) out.push({v:t,b:!!neg}); }
    else if(n.nodeType===1){
      if(pdfOculto(n)) return;
      const tag=n.tagName;
      if(tag==='BR'){ out.push({br:1}); return; }
      const bloque=/^(DIV|P|H1|H2|H3|H4|LI|UL|OL|TR|TABLE)$/.test(tag);
      if(bloque&&out.length&&!out[out.length-1].br) out.push({br:1});
      pdfTokens(n,neg||/^(B|STRONG|H1|H2|H3|H4|TH)$/.test(tag),out);
      if(bloque) out.push({br:1});
    }
  });
  return out;
}
function pdfParrafos(tokens){
  const ps=[[]];
  tokens.forEach(tk=>{
    if(tk.br){ ps.push([]); return; }
    String(tk.v).split(/\s+/).forEach(w=>{ if(w) ps[ps.length-1].push({t:w,b:!!tk.b}); });
  });
  return ps.filter(p=>p.length);
}
function pdfModelo(html){
  const doc=new DOMParser().parseFromString('<body>'+html+'</body>','text/html');
  const bloques=[];
  const volcar=(tokens,estilo)=>{ pdfParrafos(tokens).forEach(p=>bloques.push(Object.assign({k:'p',w:p},estilo))); };
  const tabla=(t)=>{
    const filas=[];
    Array.prototype.forEach.call(t.rows,tr=>{
      if(pdfOculto(tr)) return;
      const celdas=[];
      Array.prototype.forEach.call(tr.cells,td=>{
        if(pdfOculto(td)) return;
        const th=td.tagName==='TH';
        celdas.push({p:pdfParrafos(pdfTokens(td,th)),span:Math.max(1,parseInt(td.getAttribute('colspan'),10)||1),th:th,al:(td.style&&td.style.textAlign)||''});
      });
      if(celdas.length) filas.push(celdas);
    });
    if(filas.length) bloques.push({k:'t',filas:filas,borde:t.classList.contains('reportTable')});
  };
  const recorrer=(padre)=>{
    let buf=[];
    const flush=()=>{ if(buf.length){ volcar(buf,{size:9.5,antes:0,despues:3,sangria:0}); buf=[]; } };
    Array.prototype.forEach.call(padre.childNodes,n=>{
      if(n.nodeType===3){ const t=pdfLimpiar(n.nodeValue); if(t.trim()) buf.push({v:t}); return; }
      if(n.nodeType!==1||pdfOculto(n)) return;
      const tag=n.tagName;
      if(/^H[1-4]$/.test(tag)){
        flush();
        volcar(pdfTokens(n,true),{size:tag==='H1'?15:(tag==='H2'?12.5:10.5),neg:true,antes:tag==='H1'?4:7,despues:3,sangria:0});
        return;
      }
      if(tag==='TABLE'){ flush(); tabla(n); return; }
      if(tag==='UL'||tag==='OL'){
        flush();
        let i=0;
        Array.prototype.forEach.call(n.childNodes,li=>{
          if(li.nodeType===1&&li.tagName==='LI'&&!pdfOculto(li)){
            i++;
            const tk=pdfTokens(li,false);
            tk.unshift({v:(tag==='OL'?i+'.':'\u2022')});
            volcar(tk,{size:9.5,antes:0,despues:1.5,sangria:10});
          }
        });
        return;
      }
      if(tag==='HR'){ flush(); return; }
      if(tag==='BR'){ buf.push({br:1}); return; }
      if(/^(DIV|P|SECTION|MAIN|ARTICLE|LI|FORM|CENTER)$/.test(tag)){
        flush();
        if(n.querySelector('table,div,p,h1,h2,h3,h4,ul,ol,hr')) recorrer(n);
        else volcar(pdfTokens(n,false),{size:9.5,antes:0,despues:3,sangria:0});
        return;
      }
      pdfTokens({childNodes:[n]},false).forEach(t=>buf.push(t));
    });
    flush();
  };
  recorrer(doc.body);
  return bloques;
}
function pdfModeloATexto(bloques,max){
  const L=[];
  const pal=par=>par.map(p=>p.t).join(' ');
  bloques.forEach(b=>{
    if(b.k==='p') L.push(pal(b.w));
    else b.filas.forEach(f=>{
      const cs=f.map(c=>c.p.map(pal).join(' '));
      L.push(cs.length===2?cs[0]+': '+cs[1]:cs.join(' · '));
    });
  });
  let t=pdfAUnicode(L.join('\n'));
  if(t.length>max) t=t.slice(0,max).replace(/\s+\S*$/,'')+'…';
  return t;
}

/* ---------- modelo -> archivo PDF (A4, Helvetica) ---------- */
function pdfConstruir(bloques,titulo){
  const W=595.28,H=841.89,M=34,CW=W-2*M,PIE=26,TOPE=H-M-PIE;
  const paginas=[];
  let ops=null,y=0;
  const nueva=()=>{ ops=[]; paginas.push(ops); y=M; };
  const f2=n=>String(Math.round(n*100)/100);
  const esc=s=>s.replace(/([\\()])/g,'\\$1');
  const texto=(x,yy,s,neg,size)=>{ ops.push('BT /F'+(neg?2:1)+' '+f2(size)+' Tf '+f2(x)+' '+f2(H-yy)+' Td ('+esc(s)+') Tj ET'); };
  const suma=a=>a.reduce((s,v)=>s+v,0);

  function partir(t,neg,size,maxW){
    const trozos=[];
    while(t.length>1&&pdfAncho(t,neg,size)>maxW){
      let k=t.length;
      while(k>1&&pdfAncho(t.slice(0,k),neg,size)>maxW) k--;
      trozos.push(t.slice(0,k)); t=t.slice(k);
    }
    trozos.push(t);
    return trozos;
  }
  function envolver(pal,maxW,size,forzarNeg){
    const sp=pdfAncho(' ',false,size);
    const lineas=[]; let act=[],w=0;
    pal.forEach(p=>{
      const neg=!!(p.b||forzarNeg);
      partir(p.t,neg,size,maxW).forEach(t=>{
        const pw=pdfAncho(t,neg,size);
        if(act.length&&w+sp+pw>maxW){ lineas.push({pal:act,w:w}); act=[]; w=0; }
        if(act.length) w+=sp;
        act.push({t:t,b:neg,w:pw}); w+=pw;
      });
    });
    if(act.length) lineas.push({pal:act,w:w});
    return lineas;
  }
  function dibujarLinea(l,x0,ancho,yTop,size,al){
    let x=x0;
    if(al==='right') x=x0+ancho-l.w; else if(al==='center') x=x0+(ancho-l.w)/2;
    const sp=pdfAncho(' ',false,size);
    let i=0;
    while(i<l.pal.length){
      let j=i,s=l.pal[i].t,neg=l.pal[i].b,w=l.pal[i].w;
      while(j+1<l.pal.length&&l.pal[j+1].b===neg){ j++; s+=' '+l.pal[j].t; w+=sp+l.pal[j].w; }
      texto(x,yTop+size*0.95,s,neg,size);
      x+=w+sp; i=j+1;
    }
  }
  function dibujarTabla(b){
    const size=8.6,lh=size*1.28,pad=3.2;
    const nc=Math.max.apply(null,b.filas.map(f=>suma(f.map(c=>c.span))));
    const minW=new Array(nc).fill(0),maxW=new Array(nc).fill(0);
    const sp=pdfAncho(' ',false,size);
    b.filas.forEach(f=>{
      let c=0;
      f.forEach(ce=>{
        if(ce.span===1){
          let mn=0,mx=0;
          ce.p.forEach(par=>{
            let tot=0;
            par.forEach((p,i)=>{ const pw=pdfAncho(p.t,p.b||ce.th,size); mn=Math.max(mn,pw); tot+=pw+(i?sp:0); });
            mx=Math.max(mx,tot);
          });
          minW[c]=Math.max(minW[c],mn+2*pad); maxW[c]=Math.max(maxW[c],mx+2*pad);
        }
        c+=ce.span;
      });
    });
    for(let c=0;c<nc;c++){ if(!minW[c]){ minW[c]=24; maxW[c]=60; } }
    const sMin=suma(minW),sMax=suma(maxW);
    let cols;
    if(sMax<=CW) cols=maxW.map(w=>w*CW/sMax);
    else if(sMin>=CW) cols=minW.map(w=>w*CW/sMin);
    else cols=minW.map((w,i)=>w+(maxW[i]-w)*(CW-sMin)/(sMax-sMin));
    b.filas.forEach(f=>{
      let c=0,alto=0;
      const info=[];
      f.forEach(ce=>{
        let ancho=0; for(let k=0;k<ce.span;k++) ancho+=cols[c+k]||0;
        const x=M+suma(cols.slice(0,c));
        const lineas=[];
        ce.p.forEach(par=>envolver(par,ancho-2*pad,size,ce.th).forEach(l=>lineas.push(l)));
        alto=Math.max(alto,Math.max(1,lineas.length)*lh+2*pad);
        info.push({ce:ce,x:x,ancho:ancho,lineas:lineas});
        c+=ce.span;
      });
      if(y+alto>TOPE) nueva();
      info.forEach(inf=>{
        if(inf.ce.th) ops.push('0.91 g '+f2(inf.x)+' '+f2(H-y-alto)+' '+f2(inf.ancho)+' '+f2(alto)+' re f 0 g');
        if(b.borde) ops.push('0.5 w 0 G '+f2(inf.x)+' '+f2(H-y-alto)+' '+f2(inf.ancho)+' '+f2(alto)+' re S');
        let yy=y+pad;
        inf.lineas.forEach(l=>{ dibujarLinea(l,inf.x+pad,inf.ancho-2*pad,yy,size,inf.ce.al||'left'); yy+=lh; });
      });
      y+=alto;
    });
    y+=6;
  }

  nueva();
  /* Cabecera (solo primera página) */
  const p=db.perfil||{};
  const partes=[]; if(p.nombre) partes.push(p.nombre); if(p.licencia) partes.push('Lic. '+p.licencia); if(p.matricula) partes.push(p.matricula);
  const rp=pdfLimpiar(partes.join(' · '));
  if(rp){
    texto(M,y+10,rp,false,9);
    ops.push('1 w 0 G '+f2(M)+' '+f2(H-(y+16))+' m '+f2(W-M)+' '+f2(H-(y+16))+' l S');
    y+=24;
  }

  bloques.forEach((b,bi)=>{
    if(b.k==='t'){ dibujarTabla(b); return; }
    if(bi===0&&b.w.map(x=>x.t).join(' ')==='CUENTAS TAXI') return; /* títulos antiguos */
    const size=b.size,lh=size*1.28,ancho=CW-b.sangria;
    const lineas=envolver(b.w,ancho,size,b.neg);
    if(size>10&&y+b.antes+lh*3>TOPE) nueva();
    y+=b.antes;
    lineas.forEach(l=>{ if(y+lh>TOPE) nueva(); dibujarLinea(l,M+b.sangria,ancho,y,size,'left'); y+=lh; });
    y+=b.despues;
  });

  /* Pie de página */
  const tit=pdfLimpiar(titulo);
  paginas.forEach((pg,i)=>{
    ops=pg;
    ops.push('0.6 w 0.6 G '+f2(M)+' '+f2(M+PIE-8)+' m '+f2(W-M)+' '+f2(M+PIE-8)+' l S');
    texto(M,H-M-PIE+22,tit,false,7.5);
    const pn='Pag. '+(i+1)+' de '+paginas.length;
    texto(W-M-pdfAncho(pn,false,7.5),H-M-PIE+22,pn,false,7.5);
  });

  /* Ensamblado del archivo PDF */
  let out='%PDF-1.4\n%\xE2\xE3\xCF\xD3\n';
  const offs=[];
  const obj=(n,cuerpo)=>{ offs[n]=out.length; out+=n+' 0 obj\n'+cuerpo+'\nendobj\n'; };
  const nP=paginas.length;
  obj(1,'<< /Type /Catalog /Pages 2 0 R >>');
  obj(2,'<< /Type /Pages /Kids ['+paginas.map((_,i)=>(5+2*i)+' 0 R').join(' ')+'] /Count '+nP+' >>');
  obj(3,'<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>');
  obj(4,'<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>');
  paginas.forEach((pg,i)=>{
    const cont=pg.join('\n');
    obj(5+2*i,'<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+W+' '+H+'] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents '+(6+2*i)+' 0 R >>');
    obj(6+2*i,'<< /Length '+cont.length+' >>\nstream\n'+cont+'\nendstream');
  });
  const total=4+2*nP;
  obj(total+1,'<< /Title ('+esc(tit.replace(/[^\x20-\x7E]/g,''))+') /Producer (Cuentas Taxi) >>');
  const xref=out.length;
  out+='xref\n0 '+(total+2)+'\n0000000000 65535 f \n';
  for(let n=1;n<=total+1;n++) out+=String(offs[n]).padStart(10,'0')+' 00000 n \n';
  out+='trailer\n<< /Size '+(total+2)+' /Root 1 0 R /Info '+(total+1)+' 0 R >>\nstartxref\n'+xref+'\n%%EOF';
  return out;
}
function htmlAPdfBinario(html,titulo,modelo){ return pdfConstruir(modelo||pdfModelo(html),titulo); }
function htmlAPdfBlob(html,titulo,modelo){
  const bin=htmlAPdfBinario(html,titulo,modelo);
  const u8=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) u8[i]=bin.charCodeAt(i)&255;
  return new Blob([u8],{type:'application/pdf'});

function pdfNombreArchivo(titulo){

function descargarBlob(blob,nombre){

  document.body.appendChild(a); a.click();

}

function compartirVia(modo){
  const ctx=window.__shareCtx;
  if(!ctx) return;
  const aviso=document.getElementById('shareAviso');
  if(puenteNativoPdf()&&modo!=='descargar'){
    try{
      const bin=htmlAPdfBinario(ctx.html,ctx.titulo,ctx.modelo);
      AndroidTaxi.compartirPdfBase64(btoa(bin),pdfNombreArchivo(ctx.titulo),'Cuentas Taxi - '+ctx.titulo+'\n\n'+ctx.texto,modo);
      cerrarPanelCompartir();
      return;
    }catch(e){ console.warn('puente nativo:',e); }
  }
  let blob;
  try{ blob=htmlAPdfBlob(ctx.html,ctx.titulo,ctx.modelo); }
  catch(e){ console.error(e); alert('No se pudo crear el PDF: '+e.message); return; }
  const nombre=pdfNombreArchivo(ctx.titulo);
  let file=null;
  try{ file=new File([blob],nombre,{type:'application/pdf'}); }catch(e){}
  const asunto='Cuentas Taxi - '+ctx.titulo;
  const cabecera=asunto+'\n\n';
  const puedeArchivo=!!(file&&navigator.share&&navigator.canShare&&navigator.canShare({files:[file]}));
  const respaldo=function(){
    descargarBlob(blob,nombre);
    if(modo==='whatsapp'){
      window.open('https://wa.me/?text='+encodeURIComponent((cabecera+ctx.texto).slice(0,1500)),'_blank');
    }else if(modo==='mail'){
      window.location.href='mailto:?subject='+encodeURIComponent(asunto)+'&body='+encodeURIComponent((cabecera+ctx.texto).slice(0,1800));
    }
    if(aviso) aviso.textContent='PDF guardado en Descargas ("'+nombre+'"). Adjúntalo al mensaje antes de enviarlo.';
  };
  if(modo!=='descargar'&&puedeArchivo){
    navigator.share({files:[file],title:asunto,text:asunto})
      .then(()=>cerrarPanelCompartir())
      .catch(e=>{ if(e&&e.name==='AbortError') return; console.warn('share:',e); respaldo(); });
    return;
  }
  respaldo();
}

/* ===== ELECTRICIDAD: reparto de cada factura entre los meses que cubre ===== */
function isoADias(iso){ const a=String(iso).split('-').map(Number); return Math.round(Date.UTC(a[0],a[1]-1,a[2])/86400000); }
function diasEntre(a,b){ return isoADias(b)-isoADias(a)+1; }
function kmEntreFechas(a,b){
  let k=0;
  (db.days||[]).forEach(d=>{
    if(d.date&&d.date>=a&&d.date<=b&&d.endKm!=null){ const x=Number(d.endKm)-Number(d.startKm); if(x>0) k+=x; }
  });
  return k;
}
function esElectrico(){ return !!(db.perfil&&db.perfil.electrico==='si'); }
/* Parte de cada factura que cae entre «desde» y «hasta» (AAAA-MM-DD). Reparto por días o por km según el perfil */
function electricidadRango(desde,hasta){
  const modo=(db.perfil&&db.perfil.repartoElec)==='km'?'km':'dias';
  let total=0,kwh=0;
  const desglose=[],cubiertos={};
  (db.facturasElectricas||[]).forEach(f=>{
    if(!f.inicio||!f.fin) return;
    const oi=f.inicio>desde?f.inicio:desde, of=f.fin<hasta?f.fin:hasta;
    if(oi>of) return;
    const diasF=diasEntre(f.inicio,f.fin), diasOv=diasEntre(oi,of);
    let frac=diasOv/diasF, usado='dias', kmOv=0, kmF=0;
    if(modo==='km'){
      kmF=kmEntreFechas(f.inicio,f.fin);
      if(kmF>0){ kmOv=kmEntreFechas(oi,of); frac=kmOv/kmF; usado='km'; }
    }
    const parte=Number(f.importe||0)*frac, kwhP=f.kw?Number(f.kw)*frac:0;
    total+=parte; kwh+=kwhP;
    for(let i=isoADias(oi);i<=isoADias(of);i++) cubiertos[i]=1;
    desglose.push({id:f.id,inicio:f.inicio,fin:f.fin,importe:Number(f.importe||0),diasF:diasF,diasOv:diasOv,kmF:kmF,kmOv:kmOv,frac:frac,parte:parte,kw:f.kw?Number(f.kw):0,kwhParte:kwhP,metodo:usado});
  });
  return {total:total,kwh:kwh,desglose:desglose,modo:modo,diasTotal:diasEntre(desde,hasta),diasCubiertos:Object.keys(cubiertos).length};
}
function electricidadMes(ym){
  const a=ym.split('-').map(Number), ult=new Date(a[0],a[1],0).getDate();
  return electricidadRango(ym+'-01',ym+'-'+String(ult).padStart(2,'0'));
}
function textoRepartoElec(el){
  if(!el.desglose.length) return '';
  const base=el.modo==='km'?'por kilómetros recorridos':'por días';
  let t='Cada factura se reparte entre los meses que cubre '+base+'.';
  if(el.diasCubiertos<el.diasTotal) t+=' ATENCIÓN: '+(el.diasTotal-el.diasCubiertos)+' días de este periodo aún no tienen factura.';
  return t;
}

}

/* ===== REPOSTAJES Y CONSUMO (pestaña en CONSULTAS) ===== */
function repostajes(){
  if(esElectrico()) return repostajesElectrico();
  const filas=[];
  (db.days||[]).forEach(d=>(d.expenses||[]).forEach(e=>{
    if(e.categoria==='combustible') filas.push({fecha:d.date,tipo:e.tipoCombustible==='gas'?'gas':'gasolina',litros:Number(e.litros)||0,imp:Number(e.amount)||0,km:Number(e.km)||0});
  }));
  (db.gastosSueltos||[]).forEach(e=>{
    if(e.categoria==='combustible') filas.push({fecha:e.fecha,tipo:e.tipoCombustible==='gas'?'gas':'gasolina',litros:Number(e.litros)||0,imp:Number(e.amount)||0,km:Number(e.km)||0});
  });
  /* consumo de cada repostaje = litros / km desde el repostaje anterior (del mismo tipo) */
  ['gasolina','gas'].forEach(tp=>{
    const c=filas.filter(f=>f.tipo===tp&&f.km>0&&f.litros>0).sort((a,b)=>a.km-b.km);
    for(let i=1;i<c.length;i++){ const dist=c[i].km-c[i-1].km; if(dist>0){ c[i].dist=dist; c[i].c100=c[i].litros/dist*100; } }
  });
  const anios=[...new Set(filas.map(f=>String(f.fecha||'').slice(0,4)).filter(x=>x))].sort().reverse();
  const sel=state.repAnio||'todos';
  const vis=filas.filter(f=>sel==='todos'||String(f.fecha||'').startsWith(sel)).sort((a,b)=>String(b.fecha).localeCompare(String(a.fecha)));
  const bloque=(tp,titulo)=>{
    const r=vis.filter(f=>f.tipo===tp);
    if(!r.length) return '';
    const con=r.filter(f=>f.c100!=null);
    const litros=r.reduce((a,f)=>a+f.litros,0), imp=r.reduce((a,f)=>a+f.imp,0);
    const sumL=con.reduce((a,f)=>a+f.litros,0), sumD=con.reduce((a,f)=>a+f.dist,0);
    const medTotal=sumD>0?sumL/sumD*100:null;
    const medRep=con.length?con.reduce((a,f)=>a+f.c100,0)/con.length:null;
    return `<div class="card"><h2>${titulo}</h2><div class="statgrid">
      <div class="stat"><b>${r.length}</b><span>REPOSTAJES</span></div>
      <div class="stat"><b>${litros.toFixed(1)} L</b><span>LITROS</span></div>
      <div class="stat"><b>${money(imp)}</b><span>GASTO</span></div>
      <div class="stat"><b>${litros>0?(imp/litros).toFixed(3):'—'}</b><span>€/L MEDIO</span></div>
      <div class="stat"><b>${medTotal!=null?medTotal.toFixed(2):'—'}</b><span>CONSUMO MEDIO TOTAL (L/100km)</span></div>
      <div class="stat"><b>${medRep!=null?medRep.toFixed(2):'—'}</b><span>MEDIA POR REPOSTAJE (L/100km)</span></div>
      <div class="stat"><b>${sumD>0?sumD:'—'}</b><span>KM CON DATOS</span></div>
    </div></div>`;
  };
  const lista=vis.length?vis.map(f=>`<div class="item"><b>${esc(f.fecha||'')}</b> · ${f.tipo==='gas'?'🔥':'⛽'} ${f.litros?f.litros.toFixed(2)+' L':'—'} · ${money(f.imp)}<br><span class="muted">${f.litros>0?(f.imp/f.litros).toFixed(3)+' €/L':'—'}${f.km?' · coche a '+f.km+' km':''}${f.dist?' · +'+f.dist+' km':''}${f.c100!=null?' · <b>'+f.c100.toFixed(2)+' L/100km</b>':''}</span></div>`).join(''):'<p class="muted">Sin repostajes registrados.</p>';
  document.getElementById('screen').innerHTML=`
    <div class="card">
      <h2>⛽ REPOSTAJES Y CONSUMO</h2>
      <label>Periodo</label>
      <select class="input" onchange="state.repAnio=this.value;render()"><option value="todos"${sel==='todos'?' selected':''}>Todos</option>${anios.map(a=>`<option value="${a}"${sel===a?' selected':''}>${a}</option>`).join('')}</select>
      <p class="muted" style="font-size:12px;margin:6px 0 0">El consumo de cada repostaje se calcula con los km desde el repostaje anterior (hay que indicar los km del coche al repostar).</p>
    </div>
    ${bloque('gasolina','⛽ GASOLINA')}${bloque('gas','🔥 GAS')}
    <div class="card"><h2>📋 LISTA DE REPOSTAJES</h2><div class="list">${lista}</div></div>
    <button class="btn small" onclick="state.screen='bloqueConsultas';render()">⬅️ VOLVER</button>`;
}
function repostajesElectrico(){
  const fs=(db.facturasElectricas||[]).slice().sort((a,b)=>String(b.inicio).localeCompare(String(a.inicio)));
  const filas=fs.map(f=>{
    const km=kmEntreFechas(f.inicio,f.fin), kw=Number(f.kw)||0, imp=Number(f.importe)||0;
    return {f:f,km:km,kw:kw,imp:imp,k100:(kw>0&&km>0)?kw/km*100:null,e100:km>0?imp/km*100:null};
  });
  const con=filas.filter(x=>x.k100!=null);
  const sumKw=con.reduce((a,x)=>a+x.kw,0), sumKm=con.reduce((a,x)=>a+x.km,0);
  const medTotal=sumKm>0?sumKw/sumKm*100:null;
  const medFac=con.length?con.reduce((a,x)=>a+x.k100,0)/con.length:null;
  const totImp=filas.reduce((a,x)=>a+x.imp,0), totKw=filas.reduce((a,x)=>a+x.kw,0);
  const lista=filas.length?filas.map(x=>`<div class="item"><b>${esc(x.f.inicio)} → ${esc(x.f.fin)}</b> · ${money(x.imp)}<br><span class="muted">${x.kw?x.kw.toFixed(1)+' kWh':'sin kWh'}${x.kw>0?' · '+(x.imp/x.kw).toFixed(3)+' €/kWh':''} · ${x.km} km${x.k100!=null?' · <b>'+x.k100.toFixed(2)+' kWh/100km</b>':''}${x.e100!=null?' · '+x.e100.toFixed(2)+' €/100km':''}</span></div>`).join(''):'<p class="muted">Sin facturas registradas. Se añaden en REGISTRAR GASTO.</p>';
  document.getElementById('screen').innerHTML=`
    <div class="card">
      <h2>⚡ FACTURAS Y CONSUMO</h2>
      <div class="statgrid">
        <div class="stat"><b>${filas.length}</b><span>FACTURAS</span></div>
        <div class="stat"><b>${money(totImp)}</b><span>GASTO</span></div>
        <div class="stat"><b>${totKw.toFixed(1)} kWh</b><span>ENERGÍA</span></div>
        <div class="stat"><b>${medTotal!=null?medTotal.toFixed(2):'—'}</b><span>CONSUMO MEDIO TOTAL (kWh/100km)</span></div>
        <div class="stat"><b>${medFac!=null?medFac.toFixed(2):'—'}</b><span>MEDIA POR FACTURA (kWh/100km)</span></div>
      </div>
      <p class="muted" style="font-size:12px">Los km de cada factura se calculan con los días registrados dentro de sus fechas.</p>
    </div>
    <div class="card"><h2>📋 FACTURAS</h2><div class="list">${lista}</div></div>
    <button class="btn small" onclick="state.screen='bloqueConsultas';render()">⬅️ VOLVER</button>`;
}

/* ===== PDF DEL MES: con km, gastos desglosados y reparto de la electricidad ===== */
function htmlMensual(ym){
  const m=monthStats(ym);
  const ds=db.days.filter(d=>d.date&&d.date.startsWith(ym));
  const gDias=ds.reduce((a,d)=>a+sumExpenses(d),0);
  const gSueltos=(db.gastosSueltos||[]).filter(g=>g.fecha&&g.fecha.startsWith(ym)).reduce((a,g)=>a+Number(g.amount||0),0);
  const gf=m.gastosFijos||{total:0,desglose:[]};
  const el=m.elec;
  const filasGasto=[['Gastos de los días',gDias],['Gastos fuera de día',gSueltos],['Gastos fijos',gf.total]];
  if(esElectrico()) filasGasto.push(['Electricidad (reparto de facturas)',el.total]);
  const fijos=gf.desglose.length?'<h3>Gastos fijos</h3><table class="reportTable"><tr><th>Motivo</th><th>Importe</th><th>Tipo</th></tr>'+gf.desglose.map(g=>'<tr><td>'+esc(g.motivo)+'</td><td>'+money(g.importe)+'</td><td>'+esc(g.tipo)+'</td></tr>').join('')+'</table>':'';
  const elec=(esElectrico()&&el.desglose.length)?'<h3>Electricidad: reparto de facturas</h3><table class="reportTable"><tr><th>Factura</th><th>Importe</th><th>Parte de este mes</th><th>Imputado</th></tr>'+el.desglose.map(f=>'<tr><td>'+esc(f.inicio)+' - '+esc(f.fin)+'</td><td>'+money(f.importe)+'</td><td>'+(f.metodo==='km'?f.kmOv+' de '+f.kmF+' km':f.diasOv+' de '+f.diasF+' días')+'</td><td>'+money(f.parte)+'</td></tr>').join('')+'</table><p>'+esc(textoRepartoElec(el))+'</p>':'';
  return '<h2>Resumen mensual — '+esc(ym)+'</h2>'+
    '<table class="reportTable"><tr><th>Facturación</th><th>Gastos</th><th>Neto</th></tr><tr><td>'+money(m.inc)+'</td><td>'+money(m.exp)+'</td><td><b>'+money(m.net)+'</b></td></tr></table>'+
    '<table class="reportTable"><tr><th>Días trabajados</th><th>Servicios</th><th>Km hechos</th><th>Minutos</th></tr><tr><td>'+m.days+'</td><td>'+m.services+'</td><td><b>'+m.km+' km</b></td><td>'+m.minutes+'</td></tr></table>'+
    '<h3>Ingresos por forma de pago</h3><table class="reportTable"><tr><th>Forma de pago</th><th>Total</th></tr>'+Object.entries(m.t).map(([k,v])=>'<tr><td>'+esc(k)+'</td><td>'+money(v)+'</td></tr>').join('')+'</table>'+
    '<h3>Gastos del mes</h3><table class="reportTable"><tr><th>Concepto</th><th>Importe</th></tr>'+filasGasto.map(r=>'<tr><td>'+esc(r[0])+'</td><td>'+money(r[1])+'</td></tr>').join('')+'<tr><th>Total gastos</th><th>'+money(m.exp)+'</th></tr></table>'+
    fijos+elec;
}

/* ===== COPIA DE SEGURIDAD (exportar / restaurar) ===== */
function datosCopia(){ return JSON.stringify({app:'CuentasTaxi',version:1,fecha:iso(now()),datos:db}); }
function copiaSeguridad(){
  document.getElementById('screen').innerHTML=`
    <div class="card">
      <h2>💾 COPIA DE SEGURIDAD</h2>
      <p class="muted">Guarda una copia de todos tus datos (días, gastos, facturas, perfil...). Puedes restaurarla en este u otro móvil.</p>
      <button class="btn primary" onclick="exportarCopia()">📤 EXPORTAR / ENVIAR COPIA</button>
      <button class="btn blue" onclick="copiarCopiaTexto()">📋 COPIAR LA COPIA COMO TEXTO</button>
      <div class="sectionTitle" style="margin-top:16px">📥 Restaurar una copia</div>
      <p class="muted" style="font-size:12px">Esto REEMPLAZA los datos actuales por los de la copia.</p>
      <input type="file" id="cpArchivo" class="input" accept=".json,.txt,application/json,text/plain" onchange="importarCopiaArchivo(this)">
      <label>…o pega aquí el texto de la copia</label>
      <textarea id="cpTexto" class="input" rows="4" placeholder="Pega aquí el texto copiado"></textarea>
      <button class="btn danger" onclick="aplicarCopia(document.getElementById('cpTexto').value)">♻️ RESTAURAR DESDE EL TEXTO</button>
      <p id="cpAviso" class="muted" style="font-size:12px"></p>
      <button class="btn small" onclick="state.screen='bloqueUtilidades';render()">⬅️ VOLVER</button>
    </div>`;
}
function exportarCopia(){
  const json=datosCopia(), nombre='CuentasTaxi_copia_'+localDate()+'.json';
  const aviso=document.getElementById('cpAviso');
  try{
    if(window.AndroidTaxi&&typeof AndroidTaxi.compartirPdfBase64==='function'){
      AndroidTaxi.compartirPdfBase64(btoa(unescape(encodeURIComponent(json))),nombre,'Copia de seguridad de Cuentas Taxi','sistema');
      return;
    }
  }catch(e){ console.warn(e); }
  let file=null;
  try{ file=new File([json],nombre,{type:'application/json'}); }catch(e){}
  if(file&&navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){
    navigator.share({files:[file],title:'Copia de Cuentas Taxi'}).catch(e=>{ if(!e||e.name!=='AbortError'){ descargarBlob(new Blob([json],{type:'application/json'}),nombre); } });
    return;
  }
  descargarBlob(new Blob([json],{type:'application/json'}),nombre);
  if(aviso) aviso.textContent='Copia descargada: '+nombre;
}
function copiarCopiaTexto(){
  const json=datosCopia(), aviso=document.getElementById('cpAviso');
  const ta=document.createElement('textarea');
  ta.value=json; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  let ok=false; try{ ok=document.execCommand('copy'); }catch(e){}
  ta.remove();
  if(!ok&&navigator.clipboard){ navigator.clipboard.writeText(json).then(()=>{ if(aviso) aviso.textContent='Texto copiado. Pégalo en un mensaje o nota para guardarlo.'; }).catch(()=>{ if(aviso) aviso.textContent='No se pudo copiar.'; }); return; }
  if(aviso) aviso.textContent=ok?'Texto copiado. Pégalo en un mensaje o nota para guardarlo.':'No se pudo copiar.';
}
function importarCopiaArchivo(input){
  const f=input&&input.files&&input.files[0];
  if(!f) return;
  const r=new FileReader();
  r.onload=function(){ aplicarCopia(String(r.result||'')); };
  r.onerror=function(){ alert('No se pudo leer el archivo.'); };
  r.readAsText(f);
}
function aplicarCopia(texto){
  let o;
  try{ o=JSON.parse(String(texto||'').trim()); }catch(e){ return alert('El texto no es una copia válida.'); }
  const datos=(o&&o.datos)?o.datos:o;
  if(!datos||!Array.isArray(datos.days)) return alert('Eso no parece una copia de Cuentas Taxi.');
  if(!confirm('Se REEMPLAZARÁN los datos actuales ('+db.days.length+' días) por los de la copia ('+datos.days.length+' días). ¿Continuar?')) return;
  try{ localStorage.setItem(KEY+'_antes_importar',JSON.stringify(db)); }catch(e){}
  localStorage.setItem(KEY,JSON.stringify(datos));
  alert('Copia restaurada. La app se recargará.');
  location.reload();
}

/* ===== Rehacer una vez los informes diarios guardados (casilla de km y sin título) ===== */
(function(){
  try{
    if(db.migKm1) return;
    let cambio=false;
    (db.dailyReports||[]).forEach(r=>{
      const d=db.days.find(x=>x.id===r.dayId);
      if(d&&d.closed&&d.close){ try{ r.html=makeReport(d); cambio=true; }catch(e){} }
    });
    db.migKm1=true; save();
  }catch(e){ console.warn('migración informes:',e); }
})();
