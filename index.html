<head>

<title>Cuentas Taxi</title>
<style>
:root{
  --bg:#0a0014;--bg2:#14001f;
  --magenta:#ff007a;--cyan:#00e5ff;--yellow:#ffe600;
  --red:#ff2b2b;--green:#39ff14;--ink:#000;
  --text:#ffffff;--muted:#c9b8d9;
  --gold:#ffe600;--gold2:#ffee55;--ok:#39ff14;--line:#3a0050;
  --card:#1a0030;--card2:#0d0018;
  --blue:#00e5ff;--blue2:#7df0ff;
  --red2:#ff4b52;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:hidden}
body::before{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(circle at 10% 0%,rgba(255,0,122,.35),transparent 45%),
    radial-gradient(circle at 90% 100%,rgba(0,229,255,.30),transparent 45%),
    radial-gradient(circle at 80% 0%,rgba(255,230,0,.12),transparent 40%);
}
body::after{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:radial-gradient(rgba(255,255,255,.08) 1px,transparent 1.4px);
  background-size:6px 6px;mix-blend-mode:overlay;opacity:.55;
}
button,input,textarea,select{font:inherit}
.app{position:relative;z-index:2;max-width:560px;margin:auto;padding:10px 15px 90px}

/* Marca de agua */
.taxi{position:fixed;bottom:0;left:0;right:0;height:62px;display:flex;
  justify-content:space-around;align-items:center;opacity:.10;font-size:48px;
  pointer-events:none;z-index:1;filter:drop-shadow(0 0 8px rgba(255,0,122,.6))}
.taxi::before,.taxi::after{
  content:"🚕  🚖  🚕  🚖  🚕  🚖  🚕  🚖  🚕  🚖";
  position:fixed;left:0;right:0;font-size:44px;opacity:.06;
  pointer-events:none;white-space:nowrap;overflow:hidden;
  letter-spacing:60px;
}
.taxi::before{top:15%;transform:rotate(-10deg)}
.taxi::after{top:65%;transform:rotate(8deg);color:var(--cyan)}

/* Cabecera */
.brand{text-align:center;padding:10px 0 12px;position:relative}
.brandBadge{
  width:80px;height:80px;margin:0 auto 6px;border-radius:20px;
  display:flex;align-items:center;justify-content:center;font-size:46px;
  background:linear-gradient(145deg,#ffee55,#f2b800);
  border:4px solid #000;
  box-shadow:-5px 5px 0 0 var(--magenta),5px -5px 0 0 var(--cyan),0 12px 0 0 #0008;
  transform:rotate(-3deg);
}
.brand h1{
  margin:6px 0 0;
  font-family:Impact,Haettenschweiler,"Arial Black",system-ui,sans-serif;
  font-size:38px;letter-spacing:2px;line-height:1;color:#fff;
  -webkit-text-stroke:2px #000;
  text-shadow:3px 3px 0 var(--magenta),-2px -2px 0 var(--cyan);
  transform:skew(-3deg);
}
.brand h1 span{
  display:inline-block;color:var(--yellow);
  text-shadow:3px 3px 0 var(--cyan),-2px -2px 0 var(--magenta);
}
.brand p{margin:8px 0 0;color:var(--muted);font-weight:800;font-size:12px;
  text-transform:uppercase;letter-spacing:2px}

/* Tarjetas */
.card{
  background:linear-gradient(160deg,#1a0030 0%,#0d0018 100%);
  border:3px solid #000;border-radius:18px;padding:17px;margin:14px 0;
  position:relative;
  box-shadow:6px 6px 0 0 var(--magenta),-3px -3px 0 0 var(--cyan);
}
.card h2{
  font-family:Impact,"Arial Black",system-ui,sans-serif;
  margin:0 0 12px;font-size:22px;letter-spacing:1.5px;
  -webkit-text-stroke:1px #000;
  text-shadow:2px 2px 0 var(--magenta);
}
.center{text-align:center}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* Botones */
.btn{
  width:100%;border:3px solid #000;border-radius:14px;padding:16px 14px;margin:8px 0;
  background:#1d0a2e;color:#fff;
  font-family:Impact,"Arial Black",system-ui,sans-serif;
  font-size:17px;letter-spacing:1.2px;text-transform:uppercase;
  box-shadow:4px 4px 0 0 #000;
  transition:transform .08s ease,box-shadow .08s ease;
  position:relative;overflow:hidden;
}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 0 #000}
.btn.primary{
  background:linear-gradient(160deg,#ffee55,#f2b800);color:#000;
  box-shadow:5px 5px 0 0 var(--magenta),-2px -2px 0 0 var(--cyan);
}
.btn.primary:active{box-shadow:2px 2px 0 0 var(--magenta)}
.btn.primary::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(115deg,transparent 35%,#fff7 50%,transparent 65%);
  transform:translateX(-120%);animation:shine 3.5s infinite;
}
@keyframes shine{55%,100%{transform:translateX(120%)}}
.btn.danger{
  background:linear-gradient(160deg,#ff4b52,#a80e18);color:#fff;
  box-shadow:5px 5px 0 0 #000,-2px -2px 0 0 var(--magenta);
}
.btn.blue{
  background:linear-gradient(160deg,#7df0ff,#00a6c4);color:#000;
  box-shadow:5px 5px 0 0 var(--yellow);
}
.btn.small{font-size:13px;padding:11px 10px}

/* Total del día */
.dayTotal{
  background:linear-gradient(160deg,#2a0040,#12001f);
  border:3px solid #000;border-radius:18px;
  padding:14px 16px;margin:0 0 14px;
  box-shadow:6px 6px 0 0 var(--yellow),-4px -4px 0 0 var(--magenta);
  position:relative;
}
.dayTotal .label{color:var(--cyan);font-weight:900;font-size:12px;
  text-transform:uppercase;letter-spacing:2px}
.dayTotal .amount{
  color:var(--yellow);
  font-family:Impact,"Arial Black",system-ui,sans-serif;
  font-size:38px;letter-spacing:1px;
  -webkit-text-stroke:1.5px #000;
  text-shadow:3px 3px 0 var(--magenta);
}
.dayTotal .meta{color:#d6c6e6;font-size:13px;font-weight:600}
.dayTotal .net{color:var(--green);font-weight:900}

/* Inputs */
.input{
  width:100%;padding:14px;border:3px solid #000;background:#12001f;
  color:#fff;border-radius:13px;font-size:17px;margin:5px 0 10px;outline:none;
  box-shadow:3px 3px 0 0 var(--cyan);
}
.input:focus{border-color:var(--yellow);box-shadow:3px 3px 0 0 var(--magenta)}
label{display:block;color:var(--cyan);font-size:12px;font-weight:900;
  margin-top:8px;text-transform:uppercase;letter-spacing:1px}

/* Teclado numérico */
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.key{
  padding:20px 5px;border:3px solid #000;border-radius:15px;
  background:#1d0a2e;color:#fff;font-size:24px;font-weight:900;
  box-shadow:3px 3px 0 0 var(--cyan);
  font-family:Impact,"Arial Black",system-ui,sans-serif;
}
.key:active{transform:translate(2px,2px);box-shadow:1px 1px 0 0 var(--cyan);background:var(--magenta)}

.big{
  font-family:Impact,"Arial Black",system-ui,sans-serif;
  font-size:44px;font-weight:900;text-align:center;color:var(--yellow);
  -webkit-text-stroke:2px #000;
  text-shadow:4px 4px 0 var(--magenta),-2px -2px 0 var(--cyan);
  margin:12px 0;
}

/* Otros */
.pill{
  display:inline-block;padding:5px 10px;border-radius:999px;
  background:var(--cyan);color:#000;border:2px solid #000;
  font-size:12px;font-weight:900;letter-spacing:1px;
  box-shadow:2px 2px 0 0 var(--magenta);
}
.muted{color:var(--muted)}
.total{color:var(--yellow);font-family:Impact,sans-serif;font-size:26px;letter-spacing:1px}
.ok{color:var(--green)}
.dangerText{color:#ff6870}
.list{display:grid;gap:9px}
.item{
  background:linear-gradient(160deg,#1a0030,#0d0018);
  border:3px solid #000;border-radius:15px;padding:12px;
  box-shadow:3px 3px 0 0 var(--cyan);
}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{
  background:#12001f;border:3px solid #000;border-radius:14px;padding:11px;
  box-shadow:3px 3px 0 0 var(--cyan);
}
.stat b{display:block;color:var(--yellow);
  font-family:Impact,sans-serif;font-size:20px;letter-spacing:1px;
  -webkit-text-stroke:1px #000}
.stat span{color:var(--muted);font-size:11px;font-weight:800;text-transform:uppercase}
.sectionTitle{
  font-family:Impact,"Arial Black",system-ui,sans-serif;
  font-size:20px;font-weight:900;letter-spacing:1.5px;
  -webkit-text-stroke:1px #000;
  text-shadow:2px 2px 0 var(--cyan);
  margin:2px 0 10px;
}

.notice{
  padding:10px 12px;border-radius:12px;
  background:#1a0030;border:2px solid var(--cyan);
  color:#d9fbff;font-size:13px;font-weight:600;
  box-shadow:3px 3px 0 0 var(--magenta);
}
.dangerBox{background:#3a0010;border-color:#ff2b2b}
.tableWrap{overflow:auto}
.reportTable{border-collapse:collapse;width:100%;font-size:12px}
.reportTable th,.reportTable td{border:2px solid #000;padding:6px;text-align:left}
.reportTable th{background:var(--yellow);color:#000;font-weight:900}
.month{border:3px solid #000;box-shadow:6px 6px 0 0 var(--yellow),-4px -4px 0 0 var(--magenta)}
.month .total{font-size:29px}
.noPrint{display:block}

/* Hero */
.hero{border:3px solid #000;box-shadow:6px 6px 0 0 var(--yellow),-4px -4px 0 0 var(--magenta)}
.hero::before{content:"✦  ✦  ✦";display:block;color:var(--magenta);font-size:18px;
  letter-spacing:9px;margin-bottom:4px}

@media(max-width:390px){.grid{grid-template-columns:1fr}.app{padding-left:10px;padding-right:10px}}


/* ============ PDF / IMPRESIÓN LIMPIA ============ */
@media print{
  body{
    background:#fff !important;
    color:#000 !important;
    font-family:Arial,Helvetica,sans-serif !important;
    font-size:11px !important;
  }
  body::before, body::after{display:none !important}
  .taxi, #btnPerfil, #relojFlotante, .noPrint{display:none !important}
  .app{padding:0 !important;max-width:100% !important}
  .card{
    background:#fff !important;
    border:1px solid #000 !important;
    border-radius:0 !important;
    box-shadow:none !important;
    color:#000 !important;
    padding:8px !important;
    margin:6px 0 !important;
    page-break-inside:avoid;
  }
  h1,h2,h3,.sectionTitle,.big,.dayTotal .amount,.stat b,.total{
    color:#000 !important;
    -webkit-text-stroke:0 !important;
    text-shadow:none !important;
    font-family:Arial,Helvetica,sans-serif !important;
    background:none !important;
  }
  .dayTotal{background:#fff !important;border:1px solid #000 !important;box-shadow:none !important;padding:6px !important}
  .dayTotal .label,.dayTotal .meta{color:#000 !important}
  .stat{
    background:#fff !important;
    border:1px solid #000 !important;
    box-shadow:none !important;
    color:#000 !important;
    padding:4px 6px !important;
  }
  .stat span{color:#000 !important}
  .pill{background:#fff !important;border:1px solid #000 !important;color:#000 !important;box-shadow:none !important;padding:2px 6px !important;font-size:10px !important}
  .muted{color:#333 !important}
  .notice{background:#fff !important;border:1px solid #000 !important;color:#000 !important;box-shadow:none !important;padding:4px 6px !important}
  .reportTable{border-collapse:collapse !important;width:100% !important;font-size:10px !important}
  .reportTable th,.reportTable td{border:1px solid #000 !important;padding:3px 5px !important;color:#000 !important;background:#fff !important}
  .reportTable th{background:#eee !important;font-weight:bold !important}
  tr,td,th{page-break-inside:avoid}
  .pdfHeader{
    display:block !important;
    border-bottom:2px solid #000;
    padding-bottom:4px;
    margin-bottom:8px;
    font-family:Arial,sans-serif;
  }
  .pdfHeader .titulo{font-size:16px;font-weight:bold;color:#000;display:block}
  .pdfHeader .perfil{font-size:10px;color:#000;text-align:right;display:block;margin-top:-18px}
  a{color:#000 !important;text-decoration:none !important}
  @page{size:A4 portrait;margin:8mm}
}
.pdfHeader{display:none}
.pdfHeader .titulo{font-size:16px;font-weight:bold;display:block}
.pdfHeader .perfil{font-size:10px;text-align:right;display:block;margin-top:-18px}


/* Reloj flotante */
#relojFlotante{
  position:fixed;top:10px;right:10px;z-index:100;
  background:#0d0018;border:3px solid #000;border-radius:14px;
  padding:8px 12px;font-family:Impact,"Arial Black",system-ui,sans-serif;
  box-shadow:4px 4px 0 0 var(--magenta),-2px -2px 0 0 var(--cyan);
  text-align:right;line-height:1.1;pointer-events:none;
  min-width:110px;
}
#relojFlotante .hora{
  font-size:20px;color:var(--yellow);letter-spacing:1px;
  -webkit-text-stroke:1px #000;
  text-shadow:2px 2px 0 var(--magenta);
}
#relojFlotante .tiempo{
  font-size:14px;color:var(--cyan);letter-spacing:.5px;
  -webkit-text-stroke:.5px #000;
}
@media print{#relojFlotante{display:none!important}}

/* Botón flotante Perfil */
#btnPerfil{
  position:fixed;bottom:80px;left:14px;z-index:100;
  width:48px;height:48px;border-radius:50%;
  background:linear-gradient(160deg,#1a0030,#0d0018);
  border:3px solid #000;color:#fff;font-size:22px;
  display:flex;align-items:center;justify-content:center;
  box-shadow:3px 3px 0 0 var(--magenta),-2px -2px 0 0 var(--cyan);
  cursor:pointer;padding:0;
}
#btnInicio{
  position:fixed;bottom:80px;right:14px;z-index:100;
  width:48px;height:48px;border-radius:50%;
  background:linear-gradient(160deg,#1a0030,#0d0018);
  border:3px solid #000;color:#fff;font-size:22px;
  display:flex;align-items:center;justify-content:center;
  box-shadow:3px 3px 0 0 var(--cyan),-2px -2px 0 0 var(--magenta);
  cursor:pointer;padding:0;
}
#btnInicio:active{transform:translate(2px,2px);box-shadow:1px 1px 0 0 var(--cyan)}
#btnPerfil:active{transform:translate(2px,2px);box-shadow:1px 1px 0 0 var(--magenta)}
@media print{#btnPerfil,#btnInicio{display:none!important}}

.btn.gris{background:#3a2a4a;color:#888;opacity:.6;box-shadow:3px 3px 0 0 #1a0a2a;cursor:not-allowed}
.btn.gris:active{transform:none;box-shadow:3px 3px 0 0 #1a0a2a}

#btnPDF{
  position:fixed;bottom:140px;right:14px;z-index:9999;
  width:48px;height:48px;border-radius:50%;
  background:linear-gradient(160deg,#ffe15b,#f2aa00);
  border:2px solid #000;color:#000;font-size:18px;
  display:flex;align-items:center;justify-content:center;
  box-shadow:2px 2px 0 0 var(--magenta);
  cursor:pointer;padding:0;
}
#btnPDF:active{transform:translate(1px,1px);box-shadow:1px 1px 0 0 var(--magenta)}
@media print{#btnPDF{display:none!important}}

.item.emisora{background:#ffe600 !important;color:#000 !important;box-shadow:3px 3px 0 0 #000 !important}
.item.emisora *{color:#000 !important}
.item.emisora .muted{color:#333 !important}

/* Factura: forzar blanco y negro en impresión */
@media print{
  #facContenido, #facContenido *{
    background:#fff !important;
    color:#000 !important;
    -webkit-text-stroke:0 !important;
    text-shadow:none !important;
    font-family:Arial,Helvetica,sans-serif !important;
  }
  #facContenido table{border-collapse:collapse !important;width:100% !important}
  #facContenido td,#facContenido th{border:0 !important;padding:3px 6px !important;color:#000 !important}
  #facContenido div[style*="background:#eee"]{background:#eee !important;color:#000 !important}
}

/* ===== CALENDARIO ===== */
.cal-cabecera{display:flex;justify-content:space-between;align-items:center;margin:8px 0}
.cal-cabecera b{font-family:Impact,"Arial Black",system-ui,sans-serif;font-size:18px;letter-spacing:1px;-webkit-text-stroke:1px #000;text-shadow:2px 2px 0 var(--magenta)}
.cal-nav{background:#1d0a2e;color:#fff;border:2px solid #000;border-radius:10px;padding:6px 12px;font-size:18px;font-weight:900;box-shadow:2px 2px 0 0 var(--cyan);cursor:pointer}
.cal-nav:disabled{opacity:.3;cursor:not-allowed}
.cal-dias-semana{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:6px;font-weight:900;font-size:12px;color:var(--cyan);text-align:center;text-transform:uppercase}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-dia{background:#12001f;border:2px solid #000;border-radius:10px;padding:10px 4px;text-align:center;font-weight:900;font-size:14px;color:#fff;cursor:pointer;box-shadow:2px 2px 0 0 var(--cyan)}
.cal-dia:active{transform:translate(1px,1px);box-shadow:1px 1px 0 0 var(--cyan)}
.cal-dia.futuro{opacity:.25;cursor:not-allowed;color:#666}
.cal-dia.hoy{background:#3a0050;color:var(--yellow)}
.cal-dia.sel{background:var(--yellow);color:#000;box-shadow:2px 2px 0 0 var(--magenta)}

/* Compartir PDF */
.shareOverlay{position:fixed;inset:0;z-index:10000;background:rgba(0,0,0,.78);display:flex;align-items:flex-end;justify-content:center;padding:12px}
.shareBox{width:100%;max-width:520px;margin:0!important}
.btn.wa{background:linear-gradient(160deg,#6dffa0,#1faa45);color:#000}
#btnShare{position:fixed;right:14px;bottom:200px;z-index:9000;width:56px;height:56px;border-radius:50%;border:3px solid #000;background:linear-gradient(160deg,#6dffa0,#1faa45);font-size:24px;box-shadow:4px 4px 0 0 #000;display:none;align-items:center;justify-content:center;cursor:pointer}
.tap{cursor:pointer;outline:2px dashed rgba(255,230,0,.55);outline-offset:-2px}
.tap>span::after{content:" ▸"}
@media print{#btnShare,.shareOverlay,.brand{display:none!important}}
</style>

<body>
<div id="relojFlotante"></div>
<button id="btnPerfil" onclick="state.screen='perfil';render()" title="Perfil">⚙️</button>
<button id="btnInicio" onclick="irInicio()" title="Volver al inicio">🏠</button>
<button id="btnPDF" onclick="pdfFlotante()" title="Imprimir PDF">📄</button>
<button id="btnShare" onclick="compartirPdfActual()" title="Compartir PDF por WhatsApp o correo">📤</button>
<div class="app"><div class="brand"><div class="brandBadge">🚕</div><h1>CUENTAS <span>TAXI</span></h1><p id="today"></p></div><div id="dayTotal"></div><main id="screen"><div class="card center hero"><div class="big">📅 Hoy</div><button class="btn primary" onclick="state.screen='start';render()">▶️ INICIAR DÍA</button><button class="btn" onclick="state.screen='historicos';render()">📚 HISTÓRICOS</button>
<button class="btn blue" onclick="state.manual=null;state.screen='manualFecha';render()">📅 INTRODUCIR DÍA MANUAL</button>
<button class="btn" onclick="state.screen='registrarGasto';render()">💸 REGISTRAR GASTO</button></div></main></div><div class="taxi">🚕　🚖　🚕　🚖　🚕</div>
<script>
const KEY='cuentasTaxiDataV2';
const OLD='cuentasTaxiDataV1';
let db;
try{db=JSON.parse(localStorage.getItem(KEY)||'');if(!db||!Array.isArray(db.days))throw 0}catch(e){try{db=JSON.parse(localStorage.getItem(OLD)||'')}catch(_){db={}}}
if(!db||!Array.isArray(db.days))db={days:[],alerts:[],dailyReports:[],monthlyReports:[]};
db.alerts=Array.isArray(db.alerts)?db.alerts:[];db.dailyReports=Array.isArray(db.dailyReports)?db.dailyReports:[];db.monthlyReports=Array.isArray(db.monthlyReports)?db.monthlyReports:[];
let state={screen:'home',day:null,reportId:null,charge:{amount:'',method:null,terminal:null,amex:null,note:'',esEmisora:false},expense:{amount:'',concept:''},searchResults:[]};
const save=()=>localStorage.setItem(KEY,JSON.stringify(db));
let lock=false;function once(fn){if(lock)return;lock=true;setTimeout(()=>lock=false,600);fn()}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const money=n=>(Number(n)||0).toFixed(2).replace('.',',')+' €';
const now=()=>new Date();
const iso=d=>new Date(d).toISOString();
const localDate=d=>{d=d||new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const timeOf=d=>new Date(d).toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'});
const minutesBetween=(a,b)=>Math.max(0,Math.round((new Date(b)-new Date(a))/60000));
const parseMoney=s=>{let v=String(s??'').trim().replace(/\s/g,'');if(!v)return 0;const lc=v.lastIndexOf(','),ld=v.lastIndexOf('.');if(lc>-1&&lc>ld)v=v.replace(/\./g,'').replace(',','.');else if(ld>-1)v=v.replace(/,/g,'');return Number(v)||0};

function makeReport(d){
  const t = totals(d);
  const inc = sumCharges(d);
  const exp = sumExpenses(d);
  const mins = minutesBetween(d.start, d.close);

  // Fila de método: solo si > 0
  const filaMetodo = (nombre, valor)=>{
    if(!valor || valor <= 0) return '';
    return '<tr><td>'+nombre+'</td><td>'+money(valor)+'</td></tr>';
  };

  // Ingresos por pago (sin filas a 0, con Tarjeta desglosada)
  let filasIngresos = '';
  const sp = splitTarjeta(d);
  Object.entries(t).forEach(([k,v])=>{
    if(k === 'Tarjeta'){
      if(sp.antes > 0) filasIngresos += filaMetodo('Tarjeta (antes 00:00)', sp.antes);
      if(sp.despues > 0) filasIngresos += filaMetodo('Tarjeta (después 00:00)', sp.despues);
      if(v > 0) filasIngresos += '<tr><td><b>Tarjeta total</b></td><td><b>'+money(v)+'</b></td></tr>';
    } else {
      filasIngresos += filaMetodo(k, v);
    }
  });

  // Tarjeta por datáfono (solo si 2+ datáfonos)
  let bloqueDatofonos = '';
  const p = db.perfil || {};
  const nd = p.numDatofonos || 1;
  if(nd >= 2){
    const dts = (p.datofonos && p.datofonos.length) ? p.datofonos : ['PIN PAD','DATÁFONO','TPV'];
    const porDat = {};
    dts.slice(0, nd).forEach(n => porDat[n] = 0);
    (d.charges||[]).forEach(c=>{
      if(c.method === 'Tarjeta' && c.terminal && porDat.hasOwnProperty(c.terminal)){
        porDat[c.terminal] += Number(c.amount||0);
      }
    });
    const hay = Object.values(porDat).some(v=>v>0);
    if(hay){
      bloqueDatofonos = '<h3>Tarjeta por datáfono</h3><table class="reportTable"><tr><th>Datáfono</th><th>Total</th></tr>';
      Object.entries(porDat).forEach(([nom,val])=>{
        if(val > 0) bloqueDatofonos += '<tr><td>'+esc(nom)+'</td><td>'+money(val)+'</td></tr>';
      });
      bloqueDatofonos += '</table>';
    }
  }

  // Combustible (solo si hay gastos de combustible)
  let bloqueCombustible = '';
  const dsComb = (d.expenses||[]).filter(e=>e.categoria==='combustible');
  if(dsComb.length){
    let gas=0, gasL=0, glp=0, glpL=0;
    dsComb.forEach(e=>{
      if(e.tipoCombustible==='gas'){ glp+=Number(e.amount||0); glpL+=Number(e.litros||0); }
      else { gas+=Number(e.amount||0); gasL+=Number(e.litros||0); }
    });
    bloqueCombustible = '<h3>Combustible</h3><table class="reportTable"><tr><th>Tipo</th><th>Importe</th><th>Litros</th></tr>';
    if(gas > 0) bloqueCombustible += '<tr><td>⛽ Gasolina</td><td>'+money(gas)+'</td><td>'+gasL.toFixed(2)+' L</td></tr>';
    if(glp > 0) bloqueCombustible += '<tr><td>🔥 Gas</td><td>'+money(glp)+'</td><td>'+glpL.toFixed(2)+' L</td></tr>';
    bloqueCombustible += '</table>';
  }

  // Estadísticas de emisora
  let bloqueEmisora = '';
  const st = statsEmisora(d);
  if(st.num > 0){
    bloqueEmisora = '<h3>Servicios de emisora</h3><table class="reportTable">';
    bloqueEmisora += '<tr><td>Nº servicios de emisora</td><td><b>'+st.num+'</b></td></tr>';
    bloqueEmisora += '<tr><td>Importe de emisora</td><td><b>'+money(st.importe)+'</b></td></tr>';
    bloqueEmisora += '<tr><td>% sobre facturación total</td><td><b>'+st.pct.toFixed(2)+' %</b></td></tr>';
    bloqueEmisora += '</table>';
  }

  return '<h2>Cierre diario — '+esc(d.date)+'</h2>' +
    '<p><b>Inicio:</b> '+timeOf(d.start)+' · <b>Cierre:</b> '+timeOf(d.close)+' · <b>Tiempo:</b> '+mins+' min</p>' +
    '<table class="reportTable"><tr><th>Km iniciales</th><th>Km finales</th><th>Km hechos</th></tr><tr><td>'+d.startKm+'</td><td>'+(d.endKm==null?'—':d.endKm)+'</td><td><b>'+(d.endKm==null?'—':(d.endKm-d.startKm)+' km')+'</b></td></tr></table>' +
    '<h3>Ingresos por pago</h3>' +
    '<table class="reportTable"><tr><th>Pago</th><th>Total</th></tr>' +
    (filasIngresos || '<tr><td colspan="2">Sin ingresos</td></tr>') +
    '<tr><th>Total facturación</th><th>'+money(inc)+'</th></tr></table>' +
    bloqueDatofonos +
    bloqueCombustible +
    bloqueEmisora +
    (()=>{const est=estimarCombustibleDia(d);if(!est)return '';let t='<h3>Combustible estimado</h3><table class="reportTable"><tr><th>Concepto</th><th>Valor</th></tr>';if(est.tipo==='gasolina'){t+='<tr><td>Gasolina estimada</td><td>'+est.litros.toFixed(2)+' L</td></tr>';t+='<tr><td>Precio/L última</td><td>'+money(est.precioL)+'</td></tr>';t+='<tr><td>Gasto estimado</td><td>'+money(est.euros)+'</td></tr>';}else if(est.tipo==='gas'){t+='<tr><td>Gasto combustible estimado</td><td>'+money(est.euros)+'</td></tr>';}else if(est.tipo==='electrico'){t+='<tr><td>Consumo estimado</td><td>'+est.kwh.toFixed(1)+' kWh</td></tr>';t+='<tr><td>Gasto eléctrico estimado</td><td>'+money(est.euros)+'</td></tr>';}t+='</table>';return t;})() + '';
}

/* ===== EDITAR SERVICIO ===== */
function editarServicio(dayId, id){
  const d = db.days.find(x=>x.id===dayId);
  const c = d && d.charges.find(x=>x.id===id);
  if(!c) return alert('Servicio no encontrado');
  const amt = prompt('Importe (€):', String(c.amount).replace('.',','));
  if(amt===null) return;
  const n = parseMoney(amt);
  if(!(n>0)) return alert('Importe inválido');
  const metodos = ['Efectivo','Tarjeta','Amex','Abonado','Pago app','Bizum'];
  const met = prompt('Método (' + metodos.join(', ') + '):', c.method||'Efectivo');
  if(met===null) return;
  if(metodos.indexOf(met)===-1) return alert('Método inválido');
  let terminal = c.terminal, amex = c.amex;
  if(met==='Tarjeta'){
    const t = prompt('Terminal (PIN PAD / DATÁFONO):', c.terminal||'PIN PAD');
    if(t===null) return;
    terminal = t;
    const a = prompt('¿Amex? (S/N):', c.amex?'S':'N');
    if(a===null) return;
    amex = (a.toUpperCase()==='S');
  } else { terminal = null; amex = null; }
  const nota = prompt('Nota:', c.note||'');
  if(nota===null) return;
  c.amount = n; c.method = met; c.terminal = terminal; c.amex = amex; c.note = nota;
  regenReport(dayId);
  save();
  alert('Servicio actualizado');
  if(state.subVista) refrescar();
  else if(state.screen==='buscar') searchService();
  else render();
}

  if(!g) return alert('Gasto no encontrado');
  const amt = prompt('Importe (€):', String(g.amount).replace('.',','));

}


/* ===== COMPARADOR DE PERIODOS ===== */
function calcRango(desde, hasta){
  if(!desde && !hasta) return null;
  if(desde && !hasta) hasta = desde;
  if(!desde && hasta) desde = hasta;
  const d1 = new Date(desde+'T00:00:00').getTime();
  const d2 = new Date(hasta+'T23:59:59').getTime();
  if(d2 < d1) return null;
  const ds = db.days.filter(d=>{
    const t = new Date(d.date+'T12:00:00').getTime();
    return t>=d1 && t<=d2;
  });
  const t = {Efectivo:0,Tarjeta:0,Abonado:0,'Pago app':0,Bizum:0};
  let inc=0, exp=0, services=0, km=0, minutes=0;
  const porDia = [];
  ds.forEach(d=>{
    const i = sumCharges(d);
    const e = sumExpenses(d);
    inc += i; exp += e;
    services += (d.charges||[]).length;
    Object.entries(totals(d)).forEach(([k,v])=>t[k]=(t[k]||0)+v);
    let kmDia = 0;
    if(d.endKm!=null) kmDia = Number(d.endKm)-Number(d.startKm);
    km += kmDia;
    let minDia = 0;
    if(d.close) minDia = minutesBetween(d.start, d.close);
    minutes += minDia;
    porDia.push({date:d.date, inc:i, exp:e, net:i-e, km:kmDia, min:minDia, serv:(d.charges||[]).length});
  });
  porDia.sort((a,b)=>b.inc-a.inc);
  return {
    desde, hasta, days: ds.length,
    inc, exp, net: inc-exp, services, km, minutes, t,
    top: porDia.slice(0,3),
    bottom: porDia.slice(-3).reverse()
  };
}

function dif(a, b){
  const e = a - b;
  const p = b ? (e/b*100) : (a ? 100 : 0);
  return {e, p};
}

function fmtDif(a, b, esPorcentaje){
  const d = dif(a, b);
  const signo = d.e > 0 ? '+' : (d.e < 0 ? '' : '');
  const color = d.e > 0 ? 'var(--green)' : (d.e < 0 ? '#ff6870' : 'var(--muted)');
  const txt = signo + (esPorcentaje ? d.p.toFixed(1)+'%' : money(d.e));
  return '<span style="color:'+color+';font-weight:900">'+txt+'</span>';
}

function calcLitros(){
  const pr = parseMoney(document.getElementById('ggPrecio').value);
  const im = parseMoney(document.getElementById('ggImporte').value);
  const km = Math.floor(Number(document.getElementById('ggKm').value));
  const el = document.getElementById('ggLitros');
  if(!el) return;
  const ult = ultimoRepostaje();
  const kmAnterior = ult ? Number(ult.km) : 0;
  const distancia = (kmAnterior > 0 && km > kmAnterior) ? (km - kmAnterior) : 0;
  const lineas = [];
  if(pr > 0 && im > 0){
    const l = im / pr;
    lineas.push('⛽ Litros: <b>' + l.toFixed(2) + ' L</b>');
    if(distancia > 0){
      lineas.push('📍 Distancia: <b>' + distancia + ' km</b>');
      const l100 = (l / distancia) * 100;
      const eurKm = im / distancia;
      lineas.push('📊 Consumo: <b>' + l100.toFixed(2) + ' L/100km</b>');
      lineas.push('💶 Coste: <b>' + eurKm.toFixed(3) + ' €/km</b>');
    } else if(kmAnterior > 0){
      lineas.push('<span class="muted">(km introducidos menores que el último repostaje)</span>');
    } else {
      lineas.push('<span class="muted">(sin repostaje anterior para calcular distancia)</span>');
    }
  } else {
    lineas.push('Rellena precio y total');
  }
  el.innerHTML = lineas.join('<br>');
}

function gastosPorCategoria(ym){
  const ds = db.days.filter(d=>d.date && d.date.startsWith(ym));
  const gsSueltos = (db.gastosSueltos||[]).filter(g=>g.fecha && g.fecha.startsWith(ym));
  const r = {
    combustibleGasolina:{n:0,imp:0,litros:0},
    combustibleGas:{n:0,imp:0,litros:0},
    mantenimiento:{n:0,imp:0},
    admin:{n:0,imp:0},
    otros:{n:0,imp:0}
  };
  ds.forEach(d=>(d.expenses||[]).forEach(e=>{
    let key = e.categoria || 'otros';
    if(key === 'reparacion') key = 'otros';
    if(key === 'combustible'){
      const tipo = e.tipoCombustible || 'gasolina';
      key = tipo === 'gas' ? 'combustibleGas' : 'combustibleGasolina';
    }
    if(!r[key]) r[key] = {n:0,imp:0};
    r[key].n++;
    r[key].imp += Number(e.amount||0);
    if(key === 'combustibleGasolina' || key === 'combustibleGas'){
      r[key].litros += Number(e.litros||0);
    }
  }));
  gsSueltos.forEach(e=>{
    let key = e.categoria || 'otros';
    if(key === 'reparacion') key = 'otros';
    if(key === 'combustible'){
      const tipo = e.tipoCombustible || 'gasolina';
      key = tipo === 'gas' ? 'combustibleGas' : 'combustibleGasolina';
    }
    if(!r[key]) r[key] = {n:0,imp:0};
    r[key].n++;
    r[key].imp += Number(e.amount||0);
    if(key === 'combustibleGasolina' || key === 'combustibleGas'){
      r[key].litros += Number(e.litros||0);
    }
  });
  return r;
}

/* ===== SPLIT TARJETA antes/después medianoche ===== */
function splitTarjeta(d){
  const r = {antes:0, despues:0, total:0};
  if(!d || !d.charges) return r;
  const inicio = new Date(d.start);
  const medianoche = new Date(inicio);
  medianoche.setHours(24,0,0,0);
  const tMed = medianoche.getTime();
  (d.charges||[]).forEach(c=>{
    if(c.method !== 'Tarjeta') return;
    const t = new Date(c.time).getTime();
    if(t < tMed) r.antes += Number(c.amount||0);
    else r.despues += Number(c.amount||0);
    r.total += Number(c.amount||0);
  });
  return r;
}

/* ===== ABONADOS: semanas y cálculos ===== */

/* Devuelve {inicio, fin} de la semana de abonados que contiene la fecha 'ref'.
   - RTTM: miércoles 00:00 → martes 23:59
   - Otras emisoras: lunes 00:00 → domingo 23:59 */
function rangoSemana(ref){
  const p = db.perfil || {};
  const esRTTM = p.esRTTM === 'si';
  const d = new Date(ref);
  d.setHours(0,0,0,0);
  const dow = d.getDay(); // 0=domingo, 1=lunes, ... 3=miércoles, 6=sábado
  let offsetInicio;
  if(esRTTM){
    // Miércoles = 3. Offset desde el miércoles anterior (o el mismo si es miércoles).
    offsetInicio = (dow >= 3) ? (dow - 3) : (dow + 7 - 3);
  } else {
    // Lunes = 1.
    offsetInicio = (dow === 0) ? 6 : (dow - 1);
  }
  const inicio = new Date(d);
  inicio.setDate(d.getDate() - offsetInicio);
  inicio.setHours(0,0,0,0);
  const fin = new Date(inicio);
  fin.setDate(inicio.getDate() + 6);
  fin.setHours(23,59,59,999);
  return {inicio, fin};
}

/* Suma de servicios de abonados en un rango */
function calcularAbonados(desde, hasta){
  const d1 = desde.getTime(), d2 = hasta.getTime();
  const lista = [];
  let total = 0;
  (db.days||[]).forEach(d=>{
    (d.charges||[]).forEach(c=>{
      if(c.method !== 'Abonado') return;
      const t = new Date(c.time).getTime();
      if(t < d1 || t > d2) return;
      lista.push({...c, fecha: d.date});
      total += Number(c.amount||0);
    });
  });
  lista.sort((a,b)=>new Date(a.time)-new Date(b.time));
  const p = db.perfil || {};
  const pct = (p.esRTTM==='si') ? 5 : (Number(p.porcentaje)||0);
  const retenido = total * pct / 100;
  const aCobrar = total - retenido;
  return {lista, total, retenido, aCobrar, pct};
}

/* Fondo de vales: suma del 5% retenido desde el último 15 de septiembre hasta hoy */
/* Si se le pasa periodo {inicio, fin} en ms, calcula sobre ese rango */
function calcularFondoVales(periodo){
  const p = db.perfil || {};
  if(p.esRTTM !== 'si') return 0; // Solo RTTM tiene fondo de vales
  let desde, hasta;
  if(periodo && periodo.inicio && periodo.fin){
    desde = new Date(periodo.inicio);
    hasta = new Date(periodo.fin);
  } else {
    const hoy = new Date();
    hasta = new Date(hoy.getFullYear(), hoy.getMonth(), hoy.getDate(), 23,59,59);
    desde = new Date(hoy.getFullYear(), 8, 15);
    if(hoy < desde) desde = new Date(hoy.getFullYear()-1, 8, 15);
  }
  const corte = Number(db.fondoValesCorte)||0;
  if(corte && corte > desde.getTime() && corte <= hasta.getTime()) desde = new Date(corte);
  let total = 0;
  (db.days||[]).forEach(d=>{
    (d.charges||[]).forEach(c=>{
      if(c.method !== 'Abonado') return;
      const t = new Date(c.time).getTime();
      if(t < desde.getTime() || t > hasta.getTime()) return;
      total += Number(c.amount||0);
    });
  });
  return total * 0.05; // 5% para RTTM
}

/* Devuelve el periodo del fondo de vales actual: {inicio, fin} en ms */
function periodoFondoActual(){
  const hoy = new Date();
  let inicio = new Date(hoy.getFullYear(), 8, 15);
  if(hoy < inicio) inicio = new Date(hoy.getFullYear()-1, 8, 15);
  const fin = new Date(inicio.getFullYear()+1, 8, 14, 23,59,59);
  return {inicio: inicio.getTime(), fin: fin.getTime(), inicioFecha: inicio, finFecha: fin};
}

/* Devuelve el periodo del fondo de vales a partir de un texto "25/26" */
function periodoFondoDesdeTexto(txt){
  const m = String(txt).trim().match(/^(\d{2})\/(\d{2})$/);
  if(!m) return null;
  const a1 = parseInt('20'+m[1], 10);
  const a2 = parseInt('20'+m[2], 10);
  if(a2 !== a1+1) return null;
  const inicio = new Date(a1, 8, 15); // 15 sept del primer año
  const fin = new Date(a2, 8, 14, 23,59,59); // 14 sept del segundo año
  return {inicio: inicio.getTime(), fin: fin.getTime(), inicioFecha: inicio, finFecha: fin, etiqueta: m[1]+'/'+m[2]};
}

/* Texto largo de fecha */
function fmtFecha(d){
  return new Intl.DateTimeFormat('es-ES',{day:'2-digit',month:'2-digit',year:'numeric'}).format(d);
}


/* ===== PANTALLA CONSULTA ABONADOS ===== */
function abonados(){
  const p = db.perfil || {};
  if(p.tieneEmisora !== 'si'){
    document.getElementById('screen').innerHTML = `
      <div class="card center">
        <div style="font-size:52px">📻</div>
        <h2>SIN EMISORA CONFIGURADA</h2>
        <p class="muted">Para consultar abonados necesitas configurar una emisora en tu perfil.</p>
        <button class="btn primary" onclick="state.screen='perfil';render()">⚙️ IR AL PERFIL</button>
        <button class="btn small" onclick="state.screen=activeDay()?'menu':'home';render()">VOLVER</button>
      </div>`;
    return;
  }

  const hoy = new Date();
  const semActual = rangoSemana(hoy);
  const refAnterior = new Date(semActual.inicio.getTime() - 24*60*60*1000);
  const semAnterior = rangoSemana(refAnterior);

  const aAct = calcularAbonados(semActual.inicio, semActual.fin);
  const aAnt = calcularAbonados(semAnterior.inicio, semAnterior.fin);
  const esRTTM = p.esRTTM === 'si';
  const fondo = esRTTM ? calcularFondoVales() : 0;

  const bloqueSemana = (titulo, rango, datos)=>{
    const lista = datos.lista.length
      ? datos.lista.map(c=>`<div class="item"><b>${esc(c.fecha)} · ${timeOf(c.time)} · ${money(c.amount)}</b><br><span class="muted">${esc(c.note||'Sin nota')}</span></div>`).join('')
      : '<p class="muted">Sin servicios de abonados en esta semana.</p>';
    return `
      <div class="card">
        <h2>${titulo}</h2>
        <div class="muted" style="font-size:13px;margin-bottom:8px">
          ${fmtFecha(rango.inicio)} → ${fmtFecha(rango.fin)}
        </div>
        <div class="statgrid">
          <div class="stat"><b>${datos.lista.length}</b><span>SERVICIOS</span></div>
          <div class="stat"><b>${money(datos.total)}</b><span>TOTAL</span></div>
          <div class="stat"><b>${datos.pct}%</b><span>RETENCIÓN %</span></div>
          <div class="stat"><b>${money(datos.retenido)}</b><span>RETENCIÓN €</span></div>
          <div class="stat"><b>${money(datos.aCobrar)}</b><span>A COBRAR</span></div>
        </div>
        <div style="margin-top:10px">${lista}</div>
        ${esRTTM ? `<div class="notice" style="margin-top:10px">💰 Fondo de vales acumulado: <b>${money(calcularFondoVales())}</b></div>` : ''}
        <button class="btn primary" onclick="descargarAbonadosPDF('${titulo}',${rango.inicio.getTime()},${rango.fin.getTime()})">📄 DESCARGAR PDF</button>
        <button class="btn blue" onclick="compartirAbonados('${titulo}',${rango.inicio.getTime()},${rango.fin.getTime()})">📤 COMPARTIR</button>
      </div>`;
  };


  const btnFondo = esRTTM ? `<button class="btn blue" onclick="state.screen='fondoVales';render()">💰 FONDO DE VALES</button>` : '';

  document.getElementById('screen').innerHTML = `
    ${bloqueSemana('📻 SEMANA EN CURSO', semActual, aAct)}
    ${bloqueSemana('📻 SEMANA ANTERIOR', semAnterior, aAnt)}
    ${btnFondo}
    <button class="btn small" onclick="state.screen=activeDay()?'menu':'home';render()">VOLVER</button>
  `;

function pdfFlotante(){
  const scr = state.screen;

  // LIBRO DE MANTENIMIENTO → descargar libro
  if(scr === 'libroMantenimiento'){
    imprimirLibroMantenimiento();
    return;
  }

  // CONSULTAR MANTENIMIENTOS → no imprimir
  if(scr === 'consultarMantenimientos' || scr === 'verMantenimiento'){
    alert('Selecciona un mantenimiento para ver su detalle.');
    return;
  }


  // ESTADÍSTICAS → descargar el informe de consumo
  if(scr === 'estadisticasInforme'){
    estadDescargarPDF();
    return;
  }

  // FACTURA (resumen o ver) → imprimir la factura en PDF
  if(scr === 'facturaResumen' || scr === 'facturaVer'){
    facPDF();
    return;
  }

  // VER FACTURAS (lista) → no hace nada
  if(scr === 'verFacturas'){
    alert('Selecciona una factura para descargarla.');
    return;
  }

  // HACER FACTURA (cuestionario sin terminar) → no hace nada
  if(scr === 'hacerFactura' || scr === 'facturaImporte' || scr === 'facturaServicio' || scr === 'facturaCliente'){
    alert('Termina la factura primero.');
    return;
  }

  // EMPLEADO → descargar informe de cuentas del empleado
  if(scr === 'empleadoInforme'){
    guardarYDescargarEmple();
    return;
  }

  // ABONADOS → imprimir informe de abonados (semana en curso)
  if(scr === 'abonados'){
    const hoy = new Date();
    const sem = rangoSemana(hoy);
    descargarAbonadosPDF('SEMANA EN CURSO', sem.inicio.getTime(), sem.fin.getTime());
    return;
  }

  // FONDO DE VALES → imprimir fondo actual
  if(scr === 'fondoVales'){
    const per = periodoFondoActual();
    descargarFondoValesPDF(per.inicio, per.fin, 'actual');
    return;
  }

  // REPORTVIEW → imprimir el informe del día abierto
  if(scr === 'reportView'){
    const d = db.days.find(x=>x.id===state.reportId);
    if(!d){ alert('No hay informe para imprimir.'); return; }
    savePdf(d.date);
    return;
  }

  // DAYDETAIL → imprimir el informe del día que se está viendo
  if(scr === 'dayDetail'){
    const d = db.days.find(x=>x.id===state.day);
    if(!d){ alert('No hay informe para imprimir.'); return; }
    const r = db.dailyReports.find(x=>x.dayId===d.id);
    if(r){
      state.reportId = d.id;
      state.screen = 'reportView';
      render();
      setTimeout(()=>{ savePdf(d.date); }, 400);
    } else {
      alert('Este día no tiene informe guardado.');
    }
    return;
  }

  // Cualquier otra pantalla que muestre un informe (cuentas guardadas, factura de electricidad...)
  if(document.getElementById('pdfContenido') && !['menu','home','dayDetail'].includes(scr)){
    const hh = document.querySelector('#pdfContenido h2') || document.querySelector('#pdfContenido h1');
    savePdf(hh ? hh.textContent : 'Cuentas Taxi');
    return;
  }
  // MENU / HOME / otros → imprimir el día en vigor, o el último cerrado
  const a = activeDay();
  let d = a;
  if(!d) d = db.days.filter(x=>x.closed).sort((x,y)=>y.date.localeCompare(x.date))[0];
  if(!d){ alert('No hay ningún informe para imprimir.'); return; }
  const r = db.dailyReports.find(x=>x.dayId===d.id);
  if(r){
    state.reportId = d.id;
    state.screen = 'reportView';
    render();
    setTimeout(()=>{ savePdf(d.date); }, 400);
  } else {
    // Si no tiene informe (día abierto), generar uno al vuelo
    if(!d.closed){
      alert('Cierra el día antes de imprimir el informe.');
      return;
    }
    alert('Este día no tiene informe guardado.');
  }
}


/* ===== ÚLTIMO REPOSTAJE (para calcular distancia y consumo) ===== */
function ultimoRepostaje(){
  let ultimo = null;
  (db.days||[]).forEach(d=>{
    (d.expenses||[]).forEach(e=>{
      if(e.categoria !== 'combustible') return;
      if(e.km == null) return;
      const t = new Date(e.time).getTime();
      if(!ultimo || t > new Date(ultimo.time).getTime()){
        ultimo = e;
      }
    });
  });
  return ultimo;
}


/* ===== CONSUMO DEL MES Y DEL AÑO ===== */
function consumoDelPeriodo(desde, hasta){
  // desde/hasta en ms
  const ds = db.days.filter(d=>{
    const t = new Date(d.date+'T12:00:00').getTime();
    return t>=desde && t<=hasta;
  });
  const gsSueltos = (db.gastosSueltos||[]).filter(g=>{
    if(!g.fecha) return false;
    const t = new Date(g.fecha+'T12:00:00').getTime();
    return t>=desde && t<=hasta;
  });
  let totalKm = 0, totalLitros = 0, totalEuros = 0, numRepostajes = 0;
  ds.forEach(d=>(d.expenses||[]).forEach(e=>{
    if(e.categoria !== 'combustible') return;
    totalLitros += Number(e.litros||0);
    totalEuros += Number(e.amount||0);
    numRepostajes++;
  }));
  if(ds.length){
    const conKm = ds.filter(d=>d.endKm!=null);
    if(conKm.length){
      const minKm = Math.min(...conKm.map(d=>Number(d.startKm)));
      const maxKm = Math.max(...conKm.map(d=>Number(d.endKm)));
      totalKm = maxKm - minKm;
    }
  }
  const l100 = totalKm > 0 ? (totalLitros/totalKm)*100 : 0;
  const eurKm = totalKm > 0 ? totalEuros/totalKm : 0;
  return {totalKm, totalLitros, totalEuros, l100, eurKm, numRepostajes};
}

function saveFacturaElectrica(){

function keyKW(x){
  if(x === '⌫') state.kw = state.kw.slice(0,-1);

  render();
}

function saveKW(){
  const kw = parseMoney(state.kw);
  if(!(kw > 0)) return alert('Introduce los kW');
  const f = state.facturaPendiente;

  db.facturasElectricas.push({id: Date.now(), inicio: f.inicio, fin: f.fin, importe: f.importe, kw: kw, time: iso(now())});

  state.facturaPendiente = null;

  state.screen = 'registrarGasto';

function facturasElectricasDe(ym){
  if(!db.facturasElectricas) return [];
  return db.facturasElectricas.filter(f=>{
    // Cuenta si la fecha de inicio está en ese mes
    return String(f.inicio).startsWith(ym);
  });
}

function totalElectricidadMes(ym){
  const fs = facturasElectricasDe(ym);
  const imp = fs.reduce((a,f)=>a+Number(f.importe||0),0);
  const kw = fs.reduce((a,f)=>a+Number(f.kw||0),0);
  return {num: fs.length, imp, kw, eurKwh: kw>0 ? imp/kw : 0, fs};
}

function totalElectricidadAnio(anio){
  if(!db.facturasElectricas) return {num:0,imp:0,kw:0,eurKwh:0};
  const fs = db.facturasElectricas.filter(f=>String(f.inicio).startsWith(String(anio)));
  const imp = fs.reduce((a,f)=>a+Number(f.importe||0),0);
  const kw = fs.reduce((a,f)=>a+Number(f.kw||0),0);
  return {num: fs.length, imp, kw, eurKwh: kw>0 ? imp/kw : 0};
}

/* ===== ESTADÍSTICAS EMISORA ===== */
function statsEmisora(d){
  const ch = (d && d.charges) ? d.charges : [];
  let total = 0, emisoraCant = 0, emisoraImporte = 0;
  ch.forEach(c=>{
    const imp = Number(c.amount||0);
    total += imp;
    if(c.esEmisora){
      emisoraCant++;
      emisoraImporte += imp;
    }
  });
  const pct = total > 0 ? (emisoraImporte/total*100) : 0;
  return {total, num: emisoraCant, importe: emisoraImporte, pct};
}

function statsEmisoraRango(ds){
  let total = 0, emisoraCant = 0, emisoraImporte = 0;
  (ds||[]).forEach(d=>(d.charges||[]).forEach(c=>{
    const imp = Number(c.amount||0);
    total += imp;
    if(c.esEmisora){
      emisoraCant++;
      emisoraImporte += imp;
    }
  }));
  const pct = total > 0 ? (emisoraImporte/total*100) : 0;
  return {total, num: emisoraCant, importe: emisoraImporte, pct};
}


/* ===== SERVICIOS PAGO APP (pendientes de cobro) ===== */
function pagoApp(){
  // Recopilar todos los cobros con método 'Pago app' que no estén marcados como cobrados
  const pendientes = [];
  (db.days||[]).forEach(d=>{
    (d.charges||[]).forEach(c=>{
      if(c.method !== 'Pago app') return;
      if(c.pagoAppCobrado) return; // ya cobrado
      // Calcular días transcurridos desde el cobro
      const t = new Date(c.time).getTime();
      const dias = Math.floor((Date.now() - t) / (24*60*60*1000));
      // Si han pasado más de 30 días, se ignora (desaparece de la pestaña)
      if(dias > 30) return;
      pendientes.push({...c, dayId: d.id, fecha: d.date, dias: dias});
    });
  });
  // Ordenar por fecha (más antiguos primero)
  pendientes.sort((a,b)=>new Date(a.time)-new Date(b.time));

  const total = pendientes.reduce((a,c)=>a+Number(c.amount||0),0);

  const lista = pendientes.length ? pendientes.map(c=>{
    const clase = c.dias >= 10 ? 'item danger' : (c.dias >= 5 ? 'item' : 'item');
    const aviso = c.dias >= 10 ? ' ⚠️ (10+ días)' : (c.dias >= 5 ? ' ⚠️ (5+ días)' : '');
    return `<div class="${clase} row" style="cursor:pointer" onclick="marcarCobrado(${c.dayId},${c.id})">
      <div>
        <b>${money(c.amount)}</b>${aviso}<br>
        <span class="muted">${esc(c.fecha)} · ${timeOf(c.time)} · Pendiente ${c.dias} días</span><br>
        <span class="muted">${esc(c.note||'Sin nota')}</span>
      </div>
      <div style="font-size:24px">👉</div>
    </div>`;
  }).join('') : '<p class="muted">No hay servicios pendientes de cobro por app.</p>';

  document.getElementById('screen').innerHTML = `
    <div class="card">
      <h2>📱 SERVICIOS PAGO APP</h2>
      <p class="muted" style="font-size:13px;margin:0 0 10px">Pulsa en un importe cuando ya lo hayas cobrado.</p>
      <div class="statgrid">
        <div class="stat"><b>${pendientes.length}</b><span>PENDIENTES</span></div>
        <div class="stat"><b>${money(total)}</b><span>IMPORTE TOTAL</span></div>
      </div>
    </div>
    <div class="card">
      <h2>📋 PENDIENTES DE COBRO</h2>
      <div class="list">${lista}</div>
    </div>
    <button class="btn small" onclick="state.screen=activeDay()?'menu':'home';render()">VOLVER</button>
  `;
}

function marcarCobrado(dayId, id){
  const d = db.days.find(x=>x.id===dayId);
  const c = d && d.charges.find(x=>x.id===id);
  if(!c) return;
  const ok = confirm('¿Has cobrado ya el importe de ' + money(c.amount) + '?');
  if(!ok) return;
  c.pagoAppCobrado = true;
  c.pagoAppCobradoFecha = iso(now());
  save();
  alert('Cobro marcado como cobrado correctamente.');
  render();
}

/* ===== RECORDATORIOS DE PAGO APP (5 y 10 días) ===== */
function beepAvisoPagoApp(){
  try{
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const notas = [880, 660, 880];
    notas.forEach((f, i)=>{
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.frequency.value = f;
      o.type = 'sine';
      g.gain.setValueAtTime(0.15, ctx.currentTime + i*0.18);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i*0.18 + 0.3);
      o.connect(g); g.connect(ctx.destination);
      o.start(ctx.currentTime + i*0.18);
      o.stop(ctx.currentTime + i*0.18 + 0.3);
    });
  } catch(e){}
}

function checkRecordatoriosPagoApp(){
  // Solo salta 1 vez al día
  const hoy = localDate();
  const ultimo = db.pagoAppUltimoAviso;
  if(ultimo === hoy) return;

  // Buscar cobros de pago app que tengan 5 o 10 días (o más, hasta 30) sin cobrar
  const avisos = [];
  (db.days||[]).forEach(d=>{
    (d.charges||[]).forEach(c=>{
      if(c.method !== 'Pago app') return;
      if(c.pagoAppCobrado) return;
      const t = new Date(c.time).getTime();
      const dias = Math.floor((Date.now() - t) / (24*60*60*1000));
      if(dias >= 10) avisos.push({c, dias, tipo: '10 días'});
      else if(dias >= 5) avisos.push({c, dias, tipo: '5 días'});
    });
  });

  if(!avisos.length) return;

  // Marcar como avisado hoy
  db.pagoAppUltimoAviso = hoy;
  save();

  // Mostrar aviso con sonido + mensaje
  beepAvisoPagoApp();
  const msgs = avisos.map(a=>'• ' + money(a.c.amount) + ' · ' + a.c.fecha + ' (' + a.dias + ' días)');
  setTimeout(()=>{
    alert('📱 RECORDATORIO DE COBRO POR APP\n\nTienes ' + avisos.length + ' cobro(s) pendiente(s):\n\n' + msgs.join('\n') + '\n\nRevisa la pestaña 📱 SERVICIOS PAGO APP.');
  }, 500);
}


/* ===== INTRODUCIR DÍA MANUAL ===== */

// Estado temporal
if(!state.manual) state.manual = null;

// --- Paso 1: fecha ---
function manualFecha(){
  // Si es la primera vez que entramos (no hay mes inicializado), lo iniciamos
  if(!state.manual){
    state.manual = {fecha:'', kmIni:'', kmFin:'', modo:'', cobros:[], gastos:[]};
    const hoy = new Date();
    state.manualMes = {anio: hoy.getFullYear(), mes: hoy.getMonth()};
    state.manualDiaSel = '';
  }
  pintarCalendario();
}

function pintarCalendario(){
  const {anio, mes} = state.manualMes;
  const hoy = new Date(); hoy.setHours(0,0,0,0);
  const primerDia = new Date(anio, mes, 1);
  const diasEnMes = new Date(anio, mes+1, 0).getDate();
  const offset = (primerDia.getDay() + 6) % 7; // lunes = 0
  const nombresMes = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];

  // ¿Puede avanzar al siguiente mes?
  const mesSig = new Date(anio, mes+1, 1);
  const puedeAvanzar = mesSig <= hoy;

  let celdas = '';
  for(let i=0; i<offset; i++) celdas += '<div></div>';
  for(let d=1; d<=diasEnMes; d++){
    const fecha = new Date(anio, mes, d);
    fecha.setHours(0,0,0,0);
    const iso = anio+'-'+String(mes+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    const futuro = fecha > hoy;
    const sel = (iso === state.manualDiaSel);
    const esHoy = (fecha.getTime() === hoy.getTime());
    const clase = 'cal-dia' + (futuro ? ' futuro' : '') + (sel ? ' sel' : '') + (esHoy ? ' hoy' : '');
    celdas += '<div class="'+clase+'"'+(futuro?'':' onclick="calSel(\''+iso+'\')"')+'>'+d+'</div>';
  }

  document.getElementById('screen').innerHTML = `
    <div class="card">
      <h2>📅 INTRODUCIR DÍA MANUAL</h2>
      <p class="muted">Paso 1 de 5 · Elige la fecha</p>
      <div class="cal-cabecera">
        <button class="cal-nav" onclick="calMes(-1)">◀</button>
        <b>${nombresMes[mes]} ${anio}</b>
        <button class="cal-nav"${puedeAvanzar?'':' disabled'} onclick="calMes(1)">▶</button>
      </div>
      <div class="cal-dias-semana">
        <div>L</div><div>M</div><div>X</div><div>J</div><div>V</div><div>S</div><div>D</div>
      </div>
      <div class="cal-grid">${celdas}</div>
      <div class="notice" id="calFechaTxt">${state.manualDiaSel ? 'Fecha elegida: <b>'+state.manualDiaSel+'</b>' : 'Ningún día seleccionado'}</div>
      <button class="btn primary" onclick="manSetFecha()">CONTINUAR</button>
      <button class="btn small" onclick="state.manual=null;state.screen='home';render()">CANCELAR</button>
    </div>`;
}

function calMes(delta){
  const m = state.manualMes;
  m.mes += delta;
  if(m.mes < 0){ m.mes = 11; m.anio--; }
  if(m.mes > 11){ m.mes = 0; m.anio++; }
  pintarCalendario();
}

function calSel(iso){
  state.manualDiaSel = iso;
  pintarCalendario();
}

function manSetFecha(){
  const f = state.manualDiaSel;
  if(!f) return alert('Elige un día del calendario');
  const hoy = localDate();
  if(f > hoy) return alert('No puedes introducir una fecha futura');
  const existe = (db.days||[]).find(d=>d.date === f);
  if(existe) return alert('Ya existe un día con esa fecha (' + f + '). Bórralo o elige otra.');
  state.manual.fecha = f;
  state.screen = 'manualKm';
  render();
}

  const ini = document.getElementById('manKmIni').value;

/* ===== INFORME CUENTAS EMPLEADO ===== */
function calcCuentasEmpleado(fechaIni, fechaFin){
  const p = db.perfil || {};
  // Solo días con cobros o gastos
  const dias = db.days.filter(d=>{
    if(d.date < fechaIni || d.date > fechaFin) return false;
    const tieneCobros = (d.charges||[]).length > 0;
    const tieneGastos = (d.expenses||[]).length > 0;
    return tieneCobros || tieneGastos;
  });
  let totalFac = 0;
  let numDias = dias.length;
  let km = 0;
  const t = {Efectivo:0,Tarjeta:0,Abonado:0,'Pago app':0,Bizum:0};
  let gasolina = 0, gasolinaGas = 0;
  dias.forEach(d=>{
    totalFac += sumCharges(d);
    Object.entries(totals(d)).forEach(([k,v])=>t[k]=(t[k]||0)+v);
    if(d.endKm!=null) km += Number(d.endKm)-Number(d.startKm);
    (d.expenses||[]).forEach(e=>{
      if(e.categoria==='combustible'){
        if(e.tipoCombustible==='gas') gasolinaGas += Number(e.amount||0);
        else gasolina += Number(e.amount||0);
      }
    });
  });
  const totalGas = gasolina + gasolinaGas;

  // Cálculo
  let importeEmpleado = 0;
  let importePropietario = 0;
  const tipo = p.empleTipo;
  if(tipo === 'fijo'){
    const fijoDia = parseMoney(p.empleFijo);
    importePropietario = fijoDia * numDias;
    importeEmpleado = totalFac - importePropietario;
  } else if(tipo === 'porcentaje'){
    const pct = Number(p.emplePct)||0;
    importeEmpleado = totalFac * pct / 100;
    importePropietario = totalFac - importeEmpleado;
  }
  const aviso = (tipo === 'fijo' && totalFac < importePropietario);

  // Reparto real
  const cobradoEmpleado = (t.Efectivo||0) + (t.Bizum||0);
  const cobradoPropietario = (t.Tarjeta||0) + (t.Amex||0) + (t.Abonado||0) + (t['Pago app']||0);

  // Cuentas por reparto (sin gasolina)
  // Si el empleado cobró menos de lo que le corresponde → propietario le debe
  // Si el empleado cobró más → empleado debe al propietario
  let porCuentasPropAEmpl = 0;
  let porCuentasEmplAProp = 0;
  const dif = importeEmpleado - cobradoEmpleado;
  if(dif > 0) porCuentasPropAEmpl = dif;
  else if(dif < 0) porCuentasEmplAProp = -dif;

  // Ajuste por gasolina
  let porGasolinaPropAEmpl = 0;
  let porGasolinaEmplAProp = 0;
  let detalleGasolina = '';
  if(p.empleGasCorresponde && p.empleGasPaga){
    if(p.empleGasCorresponde === 'propietario' && p.empleGasPaga === 'empleado'){
      porGasolinaPropAEmpl = totalGas;
      detalleGasolina = 'Le corresponde al propietario y la pagó el empleado → el propietario devuelve ' + money(totalGas);
    } else if(p.empleGasCorresponde === 'empleado' && p.empleGasPaga === 'propietario'){
      porGasolinaEmplAProp = totalGas;
      detalleGasolina = 'Le corresponde al empleado y la pagó el propietario → el empleado devuelve ' + money(totalGas);
    } else if(p.empleGasCorresponde === p.empleGasPaga){
      detalleGasolina = 'No se ajusta (corresponde y paga la misma parte)';
    }
  }

  // Neto final
  const netoPropietarioAEmpleado = (porCuentasPropAEmpl + porGasolinaPropAEmpl) - (porCuentasEmplAProp + porGasolinaEmplAProp);

  return {
    fechaIni, fechaFin, numDias, totalFac, t, km,
    gasolina, gasolinaGas, totalGas,
    tipo, importeEmpleado, importePropietario, aviso,
    cobradoEmpleado, cobradoPropietario,
    porCuentasPropAEmpl, porCuentasEmplAProp,
    porGasolinaPropAEmpl, porGasolinaEmplAProp,
    detalleGasolina,
    netoPropietarioAEmpleado
  };
}

  db.empleInformes.push({
    id: Date.now(),

    html: html,
    resumen: c
  });
  save();

}

function estadisticas(){

function estadisticasFecha(){
  // Solo inicializamos la primera vez
  if(!state.estad || !state.estadMes){
    state.estad = state.estad || {};
    const hoy = new Date();
    state.estadMes = {anio: hoy.getFullYear(), mes: hoy.getMonth()};
    state.estadPaso = 'inicio';
    state.estadDiaSel = '';
  }
  pintarCalendarioEstad();
}

function pintarCalendarioEstad(){
  const {anio, mes} = state.estadMes;
  const hoy = new Date(); hoy.setHours(0,0,0,0);
  const diasEnMes = new Date(anio, mes+1, 0).getDate();
  const offset = (new Date(anio, mes, 1).getDay() + 6) % 7;
  const nombresMes = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  let celdas = '';
  for(let i=0; i<offset; i++) celdas += '<div></div>';
  for(let d=1; d<=diasEnMes; d++){
    const iso = anio+'-'+String(mes+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    const fecha = new Date(anio, mes, d); fecha.setHours(0,0,0,0);
    const futuro = fecha > hoy;
    const sel = (iso === state.estadDiaSel);
    const esHoy = (fecha.getTime() === hoy.getTime());
    const clase = 'cal-dia' + (futuro ? ' futuro' : '') + (sel ? ' sel' : '') + (esHoy ? ' hoy' : '');
    celdas += '<div class="'+clase+'"'+(futuro?'':' onclick="estadSelDia(\''+iso+'\')"')+'>'+d+'</div>';
  }
  const paso = state.estadPaso;
  const titulo = paso === 'inicio' ? 'Fecha INICIO' : 'Fecha FIN';
  document.getElementById('screen').innerHTML = `
    <div class="card">
      <h2>📊 ESTADÍSTICAS</h2>
      <p class="muted">${titulo} del periodo</p>
      ${state.estad.fechaIni ? '<div class="notice">Inicio: <b>'+esc(state.estad.fechaIni)+'</b></div>' : ''}
      <div class="cal-cabecera">
        <button class="cal-nav" onclick="estadMes(-1)">◀</button>
        <b>${nombresMes[mes]} ${anio}</b>
        <button class="cal-nav" onclick="estadMes(1)">▶</button>
      </div>
      <div class="cal-dias-semana">
        <div>L</div><div>M</div><div>X</div><div>J</div><div>V</div><div>S</div><div>D</div>
      </div>
      <div class="cal-grid">${celdas}</div>
      <div class="notice">${state.estadDiaSel ? 'Fecha elegida: <b>'+state.estadDiaSel+'</b>' : 'Ningún día seleccionado'}</div>
      <button class="btn primary" onclick="estadSetFecha()">CONTINUAR</button>
      <button class="btn small" onclick="state.screen='estadisticas';render()">CANCELAR</button>
    </div>`;
}

function estadMes(delta){
  const m = state.estadMes;
  m.mes += delta;
  if(m.mes < 0){ m.mes = 11; m.anio--; }
  if(m.mes > 11){ m.mes = 0; m.anio++; }
  pintarCalendarioEstad();
}

function estadSelDia(iso){
  state.estadDiaSel = iso;
  pintarCalendarioEstad();
}

function estadSetFecha(){
  const f = state.estadDiaSel;
  if(!f) return alert('Elige un día');
  if(state.estadPaso === 'inicio'){
    state.estad.fechaIni = f;
    state.estadPaso = 'fin';
    state.estadDiaSel = '';
    pintarCalendarioEstad();
  } else {
    if(f < state.estad.fechaIni) return alert('La fecha FIN no puede ser anterior a la INICIO');
    state.estad.fechaFin = f;
    state.screen = 'estadisticasInforme';
    render();
  }
}

function calcEstadisticas(fechaIni, fechaFin){
  const dias = db.days.filter(d=>d.date >= fechaIni && d.date <= fechaFin);
  let totalFac = 0, totalExp = 0, km = 0, minutos = 0, numServicios = 0;
  const t = {Efectivo:0,Tarjeta:0,Abonado:0,'Pago app':0,Bizum:0};
  let gasolina = 0, gasolinaL = 0, gas = 0, gasL = 0;
  let mant = 0, admin = 0, otros = 0;
  const gsSueltos = (db.gastosSueltos||[]).filter(g=>g.fecha && g.fecha >= fechaIni && g.fecha <= fechaFin);
  dias.forEach(d=>{
    totalFac += sumCharges(d);
    totalExp += sumExpenses(d);
    numServicios += (d.charges||[]).length;
    Object.entries(totals(d)).forEach(([k,v])=>t[k]=(t[k]||0)+v);
    if(d.endKm!=null) km += Number(d.endKm)-Number(d.startKm);
    if(d.close) minutos += minutesBetween(d.start, d.close);
    (d.expenses||[]).forEach(e=>{
      const imp = Number(e.amount||0);
      const lit = Number(e.litros||0);
      if(e.categoria === 'combustible'){
        if(e.tipoCombustible === 'gas'){ gas += imp; gasL += lit; }
        else { gasolina += imp; gasolinaL += lit; }
      } else if(e.categoria === 'mantenimiento'){ mant += imp; }
      else if(e.categoria === 'admin'){ admin += imp; }
      else { otros += imp; }
    });
  });
  gsSueltos.forEach(e=>{
    const imp = Number(e.amount||0);
    const lit = Number(e.litros||0);
    totalExp += imp;
    if(e.categoria === 'combustible'){
      if(e.tipoCombustible === 'gas'){ gas += imp; gasL += lit; }
      else { gasolina += imp; gasolinaL += lit; }
    } else if(e.categoria === 'mantenimiento'){ mant += imp; }
    else if(e.categoria === 'admin'){ admin += imp; }
    else { otros += imp; }
  });
  const totalLitros = gasolinaL + gasL;
  const l100 = km > 0 ? (totalLitros/km)*100 : 0;
  const eurKm = km > 0 ? (gasolina+gas)/km : 0;
  return {fechaIni, fechaFin, numDias: dias.length, totalFac, totalExp, neto: totalFac-totalExp, km, minutos, numServicios, t, gasolina, gasolinaL, gas, gasL, totalLitros, l100, eurKm, mant, admin, otros};
}

function estadisticasInforme(){
  const e = state.estad;
  if(!e || !e.fechaIni || !e.fechaFin){ state.screen='estadisticas'; return render(); }
  const c = calcEstadisticas(e.fechaIni, e.fechaFin);
  const p = db.perfil || {};
  const horas = Math.floor(c.minutos/60), min = c.minutos%60;
  const esElectrico = (p.electrico === 'si');
  const esGas = (p.gas === 'si');

  // Sección de consumos

  if(esElectrico){
    let totalKwh = 0, totalImpElec = 0;
    (db.facturasElectricas||[]).forEach(f=>{
      if(f.inicio >= e.fechaIni && f.inicio <= e.fechaFin){
        totalKwh += Number(f.kw||0);
        totalImpElec += Number(f.importe||0);
      }
    });
    const eurKwh = totalKwh > 0 ? totalImpElec/totalKwh : 0;

    bloqueConsumo = '<h3>Consumos</h3><table class="reportTable"><tr><th>Concepto</th><th>Valor</th></tr>' +
      '<tr><td>Consumo total</td><td><b>'+totalKwh.toFixed(1)+' kWh</b></td></tr>' +
      '<tr><td>Gasto total</td><td><b>'+money(totalImpElec)+'</b></td></tr>' +
      '<tr><td>Precio medio</td><td><b>'+eurKwh.toFixed(3)+' €/kWh</b></td></tr>' +
      '<tr><td>Coste por km</td><td><b>'+eurKm.toFixed(3)+' €/km</b></td></tr>' +
      '</table>';
  } else {
    bloqueConsumo = '<h3>Consumos</h3><table class="reportTable"><tr><th>Concepto</th><th>Valor</th></tr>';
    bloqueConsumo += '<tr><td>Litros gasolina</td><td>'+c.gasolinaL.toFixed(2)+' L ('+money(c.gasolina)+')</td></tr>';
    if(esGas) bloqueConsumo += '<tr><td>Litros gas</td><td>'+c.gasL.toFixed(2)+' L ('+money(c.gas)+')</td></tr>';
    bloqueConsumo += '<tr><td>Total litros</td><td><b>'+c.totalLitros.toFixed(2)+' L</b></td></tr>';
    bloqueConsumo += '<tr><td>Km recorridos</td><td>'+c.km+' km</td></tr>';
    bloqueConsumo += '<tr><td>Consumo medio</td><td><b>'+c.l100.toFixed(2)+' L/100km</b></td></tr>';
    bloqueConsumo += '<tr><td>Coste por km</td><td><b>'+c.eurKm.toFixed(3)+' €/km</b></td></tr>';
    bloqueConsumo += '</table>';
  }

  document.getElementById('screen').innerHTML = `
    <div class="card">
      <div class="noPrint">
        <h2>📈 ESTADÍSTICAS DE CONSUMO</h2>
        <button class="btn primary" onclick="estadDescargarPDF()">📄 DESCARGAR PDF</button>
        <button class="btn blue" onclick="compartirPdfActual()">📤 COMPARTIR PDF</button>
        <button class="btn blue" onclick="estadNuevoPeriodo()">✏️ CAMBIAR PERIODO</button>
        <button class="btn small" onclick="state.screen='estadisticas';render()">⬅️ VOLVER</button>
      </div>
      <div id="pdfContenido">
        <h1>ESTADÍSTICAS DE CONSUMO</h1>
        <h2>Periodo: ${esc(c.fechaIni)} → ${esc(c.fechaFin)} (${c.numDias} días)</h2>
        <h3>Resumen del periodo</h3>
        <table class="reportTable"><tr><th>Concepto</th><th>Valor</th></tr>
        <tr><td>Facturación total</td><td>${money(c.totalFac)}</td></tr>
        <tr><td>Gastos totales</td><td>${money(c.totalExp)}</td></tr>
        <tr><td>Servicios</td><td>${c.numServicios}</td></tr>
        <tr><td>Tiempo trabajado</td><td>${horas}h ${min}min</td></tr>
        </table>
        ${bloqueConsumo}
      </div>
      <div class="noPrint" style="margin-top:16px;padding-bottom:120px">
        <button class="btn primary" onclick="estadDescargarPDF()">📄 DESCARGAR PDF</button>
        <button class="btn blue" onclick="compartirPdfActual()">📤 COMPARTIR PDF</button>
        <button class="btn small" onclick="state.screen='estadisticas';render()">⬅️ VOLVER</button>
      </div>
    </div>
  `;
}

/* ===== EDITAR GASTO DE UN DÍA ===== */
function editarGastoDia(dayId, id){
  const d = db.days.find(x=>x.id===dayId);
  const g = d && (d.expenses||[]).find(x=>x.id===id);
  if(!g){ alert('Gasto no encontrado'); return; }
  const cat = g.categoria || 'otros';

  if(cat === 'combustible'){
    const precio = prompt('Precio por litro (€/L):', String(g.precioL||'').replace('.',','));
    if(precio===null) return;
    const km = prompt('Km actuales:', String(g.km||''));
    if(km===null) return;
    const importe = prompt('Importe total (€):', String(g.amount||'').replace('.',','));
    if(importe===null) return;
    const precioN = parseMoney(precio);
    const kmN = Math.floor(Number(km));
    const importeN = parseMoney(importe);
    if(!(precioN>0) || !(importeN>0)){ alert('Datos inválidos'); return; }
    g.precioL = precioN;
    g.km = kmN;
    g.amount = importeN;
    g.litros = importeN / precioN;
  } else if(cat === 'mantenimiento'){
    const km = prompt('Km a los que se hizo:', String(g.km||''));
    if(km===null) return;
    const desc = prompt('Descripción:', g.desc || g.concept || '');
    if(desc===null) return;
    const importe = prompt('Importe (€):', String(g.amount||'').replace('.',','));
    if(importe===null) return;
    const importeN = parseMoney(importe);
    if(!desc.trim()){ alert('Descripción obligatoria'); return; }
    g.km = Math.floor(Number(km));
    g.desc = desc.trim();
    g.concept = 'Mantenimiento: ' + desc.trim();
    g.amount = importeN;
  } else if(cat === 'admin'){
    const desc = prompt('Descripción:', g.desc || g.concept || '');
    if(desc===null) return;
    const importe = prompt('Importe (€):', String(g.amount||'').replace('.',','));
    if(importe===null) return;
    const importeN = parseMoney(importe);
    if(!(importeN>0)){ alert('Importe inválido'); return; }
    g.desc = desc.trim();
    g.concept = 'Admin: ' + desc.trim();
    g.amount = importeN;
  } else {
    const desc = prompt('Concepto:', g.concept || '');
    if(desc===null) return;
    const importe = prompt('Importe (€):', String(g.amount||'').replace('.',','));
    if(importe===null) return;
    const importeN = parseMoney(importe);
    if(!(importeN>0)){ alert('Importe inválido'); return; }
    g.concept = desc.trim();
    g.amount = importeN;
  }

  regenReport(dayId);
  save();
  alert('Gasto actualizado');
  refrescar();
}

function borrarGastoDia(dayId, id){
  const d = db.days.find(x=>x.id===dayId);
  const g = d && (d.expenses||[]).find(x=>x.id===id);
  if(!g) return;
  if(!confirm('¿Borrar el gasto de ' + money(g.amount) + '?')) return;
  d.expenses = d.expenses.filter(x=>x.id!==id);
  regenReport(dayId);
  save();
  refrescar();
}

  const lista = exp.length ? exp.map(g=>{
    const cat = g.categoria || 'otros';

    if(cat === 'combustible'){
      detalle = (g.tipoCombustible==='gas'?'🔥 Gas':'⛽ Gasolina') + ' · ' + (g.litros?Number(g.litros).toFixed(2)+' L':'—') + (g.km?' · '+g.km+' km':'');
    } else if(cat === 'mantenimiento'){
      detalle = '🔧 Mantenimiento' + (g.km?' · '+g.km+' km':'');
    } else if(cat === 'admin'){
      detalle = '📋 Administrativo';
    } else {

  document.getElementById('screen').innerHTML = `

      <h2>💸 GASTOS DEL DÍA</h2>

        <div><span class="pill">${esc(d.date)}</span></div>

      <div class="list">${lista}</div>
    </div>
    <button class="btn small" onclick="state.screen='dayDetail';state.day=${d.id};render()">⬅️ VOLVER</button>

function empleadoFecha(){
  if(!state.empleMes || !state.emple){
    state.emple = state.emple || {};
    const hoy = new Date();
    state.empleMes = {anio: hoy.getFullYear(), mes: hoy.getMonth()};
    state.empleDiaSel = state.emple.fechaIni || '';
    state.emplePaso = 'inicio';
  }
  pintarCalendarioEmple();
}

function pintarCalendarioEmple(){
  const {anio, mes} = state.empleMes;
  const hoy = new Date(); hoy.setHours(0,0,0,0);
  const diasEnMes = new Date(anio, mes+1, 0).getDate();
  const offset = (new Date(anio, mes, 1).getDay() + 6) % 7;
  const nombresMes = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  let celdas = '';
  for(let i=0; i<offset; i++) celdas += '<div></div>';
  for(let d=1; d<=diasEnMes; d++){
    const iso = anio+'-'+String(mes+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    const fecha = new Date(anio, mes, d); fecha.setHours(0,0,0,0);
    const futuro = fecha > hoy;
    const sel = (iso === state.empleDiaSel);
    const esHoy = (fecha.getTime() === hoy.getTime());
    const clase = 'cal-dia' + (futuro ? ' futuro' : '') + (sel ? ' sel' : '') + (esHoy ? ' hoy' : '');
    celdas += '<div class="'+clase+'"'+(futuro?'':' onclick="empleSelDia(\''+iso+'\')"')+'>'+d+'</div>';
  }
  const paso = state.emplePaso;
  const titulo = paso === 'inicio' ? 'Fecha INICIO del periodo' : 'Fecha FIN del periodo';
  document.getElementById('screen').innerHTML = `
    <div class="card">
      <h2>💰 CUENTAS EMPLEADO</h2>
      <p class="muted">${titulo}</p>
      ${state.emple.fechaIni ? '<div class="notice">Inicio: <b>'+esc(state.emple.fechaIni)+'</b></div>' : ''}
      <div class="cal-cabecera">
        <button class="cal-nav" onclick="empleMes(-1)">◀</button>
        <b>${nombresMes[mes]} ${anio}</b>
        <button class="cal-nav" onclick="empleMes(1)">▶</button>
      </div>
      <div class="cal-dias-semana">
        <div>L</div><div>M</div><div>X</div><div>J</div><div>V</div><div>S</div><div>D</div>
      </div>
      <div class="cal-grid">${celdas}</div>
      <div class="notice" id="empleFechaTxt">${state.empleDiaSel ? 'Fecha elegida: <b>'+state.empleDiaSel+'</b>' : 'Ningún día seleccionado'}</div>
      <button class="btn primary" onclick="empleSetFecha()">CONTINUAR</button>
      <button class="btn small" onclick="state.screen='empleado';render()">CANCELAR</button>
    </div>`;
}

function empleMes(delta){
  const m = state.empleMes;
  m.mes += delta;
  if(m.mes < 0){ m.mes = 11; m.anio--; }
  if(m.mes > 11){ m.mes = 0; m.anio++; }
  pintarCalendarioEmple();
}

function empleSelDia(iso){
  state.empleDiaSel = iso;
  pintarCalendarioEmple();
}

function empleSetFecha(){
  const f = state.empleDiaSel;
  if(!f) return alert('Elige un día del calendario');
  if(state.emplePaso === 'inicio'){
    state.emple.fechaIni = f;
    state.emplePaso = 'fin';
    state.empleDiaSel = '';
    pintarCalendarioEmple();
  } else {
    if(f < state.emple.fechaIni) return alert('La fecha FIN no puede ser anterior a la fecha INICIO');
    state.emple.fechaFin = f;
    // Aviso si facturación < fijo propietario
    const p = db.perfil || {};
    if(p.empleTipo === 'fijo'){
      const c = calcCuentasEmpleado(state.emple.fechaIni, state.emple.fechaFin);
      if(c.aviso){
        const ok = confirm('⚠️ El importe facturado (' + money(c.totalFac) + ') es inferior al fijo del propietario (' + money(c.importePropietario) + ') en este periodo. ¿Deseas continuar con las cuentas?');
        if(!ok) return;
      }
    }
    state.screen = 'empleadoInforme';
    render();
  }
}

/* ===== ESTIMACIÓN DE COMBUSTIBLE POR TIPO DE VEHÍCULO ===== */

// Media L/100km de gasolina (media aritmética de todos los repostajes de gasolina)
function mediaGasolinaL100(){
  const reps = [];
  // Recopilar de días
  (db.days||[]).forEach(d=>{
    (d.expenses||[]).forEach(e=>{
      if(e.categoria === 'combustible' && (e.tipoCombustible || 'gasolina') === 'gasolina'){
        if(e.litros && e.km){
          reps.push({km: Number(e.km), litros: Number(e.litros)});
        }
      }
    });
  });
  // Recopilar de gastos sueltos
  (db.gastosSueltos||[]).forEach(e=>{
    if(e.categoria === 'combustible' && (e.tipoCombustible || 'gasolina') === 'gasolina'){
      if(e.litros && e.km){
        reps.push({km: Number(e.km), litros: Number(e.litros)});
      }
    }
  });

  // Ordenar todos los repostajes por km
  reps.sort((a,b)=>a.km-b.km);

  if(reps.length < 2) return null;

  // Calcular L/100km de cada repostaje basándose en la distancia real entre repostajes
  const l100s = [];
  for(let i=1; i<reps.length; i++){
    const dist = reps[i].km - reps[i-1].km;
    if(dist > 0){
      // Los litros utilizados son los del repostaje actual
      l100s.push((reps[i].litros / dist) * 100);
    }
  }

  if(!l100s.length) return null;

  // Media aritmética de todos los L/100km calculados
  const media = l100s.reduce((a,b)=>a + b, 0) / l100s.length;
  return media;
}

// Último precio/L de gasolina
function ultimoPrecioGasolina(){
  let ultimo = null;
  (db.days||[]).forEach(d=>{
    (d.expenses||[]).forEach(e=>{
      if(e.categoria === 'combustible' && (e.tipoCombustible || 'gasolina') === 'gasolina' && e.precioL){
        const t = new Date(e.time || e.fecha || 0).getTime();
        if(!ultimo || t > ultimo.t){
          ultimo = {t, precio: Number(e.precioL)};
        }
      }
    });
  });
  (db.gastosSueltos||[]).forEach(e=>{
    if(e.categoria === 'combustible' && (e.tipoCombustible || 'gasolina') === 'gasolina' && e.precioL){
      const t = new Date(e.fecha || e.time || 0).getTime();
      if(!ultimo || t > ultimo.t){
        ultimo = {t, precio: Number(e.precioL)};
      }
    }
  });
  return ultimo ? ultimo.precio : null;
}

// Media €/100km combinada (gasolina + gas)
function mediaCombustibleEuros100(){
  let totalGasto = 0;
  let minKm = null, maxKm = null;
  (db.days||[]).forEach(d=>{
    (d.expenses||[]).forEach(e=>{
      if(e.categoria === 'combustible' && e.km){
        totalGasto += Number(e.amount || 0);
        const k = Number(e.km);
        if(minKm === null || k < minKm) minKm = k;
        if(maxKm === null || k > maxKm) maxKm = k;
      }
    });
  });
  (db.gastosSueltos||[]).forEach(e=>{
    if(e.categoria === 'combustible' && e.km){
      totalGasto += Number(e.amount || 0);
      const k = Number(e.km);
      if(minKm === null || k < minKm) minKm = k;
      if(maxKm === null || k > maxKm) maxKm = k;
    }
  });
  if(minKm === null || maxKm === null || maxKm <= minKm) return null;
  const totalKm = maxKm - minKm;
  return (totalGasto / totalKm) * 100;
}

// Última factura eléctrica (devuelve {importe, kw, km})
function ultimaFacturaElectrica(){
  if(!db.facturasElectricas || !db.facturasElectricas.length) return null;
  const ordenadas = db.facturasElectricas.slice().sort((a,b)=>b.inicio.localeCompare(a.inicio));
  const f = ordenadas[0];
  // Calcular km del periodo: suma de km de los días trabajados entre f.inicio y f.fin
  let kmPeriodo = 0;
  (db.days||[]).forEach(d=>{
    if(d.date >= f.inicio && d.date <= f.fin && d.endKm != null){
      kmPeriodo += Number(d.endKm) - Number(d.startKm);
    }
  });
  return {
    importe: Number(f.importe || 0),
    kw: Number(f.kw || 0),
    km: kmPeriodo,
    inicio: f.inicio,
    fin: f.fin
  };
}

// Estimar combustible del día según tipo de vehículo
function estimarCombustibleDia(d){
  if(!d || d.endKm == null || d.startKm == null) return null;
  const km = Number(d.endKm) - Number(d.startKm);
  if(km <= 0) return null;
  const p = db.perfil || {};
  const esElectrico = (p.electrico === 'si');
  const esGas = (p.gas === 'si');

  if(esElectrico){
    const f = ultimaFacturaElectrica();
    if(!f || !f.km) return null;
    const kwhKm = f.kw / f.km;
    const eurKm = f.importe / f.km;
    return {
      tipo: 'electrico',
      km: km,
      kwh: km * kwhKm,
      euros: km * eurKm
    };
  } else if(esGas){
    const media = mediaCombustibleEuros100();
    if(media === null) return null;
    return {
      tipo: 'gas',
      km: km,
      euros: (km * media) / 100
    };
  } else {
    // Gasolina
    const media = mediaGasolinaL100();
    const precio = ultimoPrecioGasolina();
    if(media === null) return null;
    const litros = (km * media) / 100;
    return {
      tipo: 'gasolina',
      km: km,
      litros: litros,
      euros: precio ? (litros * precio) : null,
      mediaL100: media,
      precioL: precio
    };
  }
}

/* ===== ALERTAS DE MANTENIMIENTO ===== */
function checkAlertasMantenimiento(kmActuales){
  const p = db.perfil || {};
  const esElectrico = (p.electrico === 'si');
  const tipo = esElectrico ? 'Revisión' : 'Cambio de aceite';
  const kmBase = esElectrico ? p.kmRevision : p.kmAceite;
  const intervalo = esElectrico ? p.intervaloRevision : p.intervaloAceite;
  const umbral = p.umbralAlertaKm || 1000;

  let alertas = [];

  // Comprobar revisión/aceite
  if(kmBase != null && intervalo != null){
    const proximo = kmBase + intervalo;
    const diff = proximo - kmActuales;
    if(diff <= 0){
      if(!p['avisoPasado_' + (esElectrico ? 'rev' : 'ace')]){
        alertas.push('⚠️ Te has pasado de los kilómetros de ' + tipo.toLowerCase() + ' (toca a los ' + proximo + ' km, llevas ' + kmActuales + ' km).');
        p['avisoPasado_' + (esElectrico ? 'rev' : 'ace')] = true;
      }
    } else if(diff <= umbral){
      if(!p['aviso1000_' + (esElectrico ? 'rev' : 'ace')]){
        alertas.push('🔔 Te quedan ' + diff + ' km para el ' + tipo.toLowerCase() + ' (próximo a los ' + proximo + ' km).');
        p['aviso1000_' + (esElectrico ? 'rev' : 'ace')] = true;
      }
    }
  }

  // Comprobar filtros
  const filtros = p.filtrosMantenimiento || [];
  filtros.forEach((f, i)=>{
    if(f.kmUltimoCambio != null && f.intervaloKm > 0){
      const proximo = f.kmUltimoCambio + f.intervaloKm;
      const diff = proximo - kmActuales;
      if(diff <= 0){
        if(!f.avisoPasado){
          alertas.push('⚠️ Te has pasado de los kilómetros del filtro "' + f.nombre + '" (toca a los ' + proximo + ' km).');
          f.avisoPasado = true;
        }
      } else if(diff <= umbral){
        if(!f.aviso1000){
          alertas.push('🔔 Te quedan ' + diff + ' km para el filtro "' + f.nombre + '" (próximo a los ' + proximo + ' km).');
          f.aviso1000 = true;
        }
      }
    }
  });

  save();

  if(alertas.length){
    // Globo
    alert(alertas.join('\n\n'));
    // Voz (usamos el beep existente)
    try { beepAvisoPagoApp(); } catch(e) {}
  }
}

function amountPad(kind){
  const o = state[kind];
  return `<div class="card"><h2>${kind==='charge'?'💶 Cobro':'💸 Gasto'}</h2><div class="big">${esc(o.amount||'0,00')} €</div><div class="keypad">${['1','2','3','4','5','6','7','8','9',',','0','⌫'].map(x=>`<button class="key" onclick="key('${kind}','${x}')">${x}</button>`).join('')}</div><button class="btn primary" onclick="confirmAmount('${kind}')">CONTINUAR</button><button class="btn small" onclick="state.screen='menu';render()">VOLVER</button></div>`;
}
function key(k, x){
  let o = state[k];
  if(x === '⌫'){ o.amount = o.amount.slice(0, -1); }
  else if(x === ','){ if(!o.amount.includes(',') && !o.amount.includes('.')){ o.amount += (o.amount ? ',' : '0,'); } }
  else { o.amount += (o.amount === '0' ? '' : x); }
  render();
}
function confirmAmount(k){
  const n = parseMoney(state[k].amount);
  if(!(n > 0)) return alert('Introduce un importe válido.');
  state[k].amount = n.toFixed(2).replace('.', ',');
  if(k === 'charge'){
    const p = db.perfil || {};
    if(p.tieneEmisora === 'si'){ state.screen = 'emisora'; }
    else { state.charge.esEmisora = false; state.screen = 'pay'; }
  } else { state.screen = 'gastosConcept'; }
  render();
}


/* ===== CÁLCULO DE CONSUMO POR REPOSTAJE ===== */
function recalcularConsumosRepostajes(){
  // Recopilar todos los repostajes (días y sueltos)
  const reps = [];
  (db.days||[]).forEach(d=>{
    (d.expenses||[]).forEach(e=>{
      if(e.categoria === 'combustible' && e.km && e.litros){
        reps.push(e);
      }
    });
  });
  (db.gastosSueltos||[]).forEach(e=>{
    if(e.categoria === 'combustible' && e.km && e.litros){
      reps.push(e);
    }
  });
  // Ordenar por km
  reps.sort((a,b)=>Number(a.km)-Number(b.km));
  // Calcular L/100km para cada uno
  for(let i=0; i<reps.length; i++){
    if(i === 0){
      reps[i].consumo100km = null;
    } else {
      const dist = Number(reps[i].km) - Number(reps[i-1].km);
      if(dist > 0){
        reps[i].consumo100km = (Number(reps[i].litros) / dist) * 100;
      } else {
        reps[i].consumo100km = null;
      }
    }
  }
  save();
  return reps;
}
